/* Layout: Hochformat-Stapel (Kopf, Inhalt, Navigation); im Match feste Bühne ohne Scrollen */
:root {
  color-scheme: light;
  --ink: #14203d;
  --sky: #2b5cc4; --sky-hi: #3d74e0; --sky-deep: #1d3f8f;
  --paper: #fff6dc; --paper-2: #f3e2b6; --paper-3: #e6cf98;
  --sun: #ffc83d; --sun-dk: #d98e0b;
  --leaf: #5fd068; --leaf-dk: #2f9a3a;
  --berry: #ff5d4f; --berry-dk: #b9322a;
  --blue: #4f9cf5; --blue-dk: #2363c4;
  --ice: #9fd8ff; --muted: #6d7a99; --white: #ffffff;
  --team-w: #4f9cf5; --team-b: #ff5d4f;
  --r-standard: #c9d2e3; --r-gewoehnlich: #5fd068; --r-selten: #4f9cf5; --r-episch: #b66cff; --r-legendaer: #ffb02e;
  --font-display: 'Erica One', 'Arial Black', Impact, sans-serif;
  --font-ui: 'National Park', 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px);
  --speed: 1;
  --nav-h: 68px;
  --outline: -2px -2px 0 var(--ink), 2px -2px 0 var(--ink), -2px 2px 0 var(--ink), 2px 2px 0 var(--ink), 0 -2px 0 var(--ink), 0 2px 0 var(--ink), -2px 0 0 var(--ink), 2px 0 0 var(--ink), 0 3.5px 0 var(--ink);
}
/* Kleine Schrift mit Kontur: National Park + Schatten-Kontur (bleibt lesbar) */
.out { font-family: var(--font-ui); font-weight: 700; color: var(--white); -webkit-text-stroke: 0; text-shadow: var(--outline); }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
body {
  background-color: var(--sky);
  background-image:
    radial-gradient(ellipse at 50% 0%, rgba(255,255,255,.18), transparent 60%),
    conic-gradient(rgba(255,255,255,.07) 25%, transparent 0 50%, rgba(255,255,255,.07) 0 75%, transparent 0);
  background-size: 100% 100%, 56px 56px;
  color: var(--ink); font-family: var(--font-ui); font-size: 16px; line-height: 1.35; font-weight: 700;
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: manipulation;
}
button, input, select, textarea { font-family: inherit; font-weight: 700; }
.hidden { display: none !important; }
.ic { width: 1.4em; height: 1.4em; display: inline-block; vertical-align: middle; flex: none; overflow: visible; }

/* Schrift mit Kontur, wie in Mobile-Games */
.toon { font-family: var(--font-display); color: var(--white); -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill; text-shadow: 0 3px 0 var(--ink); letter-spacing: .02em; }
.toon-sm { font-family: var(--font-ui); font-weight: 700; color: var(--white); text-shadow: var(--outline); }

#bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
#app { position: fixed; inset: 0; z-index: 1; }
#fx-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 900; }
#flash { position: fixed; inset: 0; pointer-events: none; z-index: 880; background: #fff; opacity: 0; }

/* ---------------- Grundgerüst eines Screens ---------------- */
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; padding-left: var(--sal); padding-right: var(--sar); animation: scr-in calc(.28s * var(--speed)) cubic-bezier(.2,1.4,.4,1); }
@keyframes scr-in { from { transform: translateY(14px); opacity: 0; } }
.topbar { flex: none; display: flex; align-items: center; gap: 10px; padding: calc(var(--sat) + 10px) 12px 8px; min-height: 60px; }
.topbar .title { flex: 1; min-width: 0; font-size: 24px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 4px 2px; }
.main { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; padding: 4px 12px 16px; overscroll-behavior: contain; }
.screen.has-nav .main { padding-bottom: calc(var(--nav-h) + var(--sab) + 16px); }
.wrap { width: 100%; max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

/* EP-Anzeige */
.ep-chip { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px 0 4px; border-radius: 999px; background: var(--sky-deep); border: 3px solid var(--ink); box-shadow: 0 3px 0 var(--ink); }
.ep-chip .ic { width: 34px; height: 34px; margin-left: -6px; }
.ep-chip .ep-val { font-family: var(--font-ui); font-weight: 700; font-size: 20px; color: var(--white); text-shadow: var(--outline); font-variant-numeric: tabular-nums; }
.ep-chip.bump { animation: bump .4s cubic-bezier(.2,2,.4,1); }
@keyframes bump { 40% { transform: scale(1.18) rotate(-4deg); } }

/* ---------------- Knöpfe (3D, drückbar) ---------------- */
.btn { position: relative; appearance: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 8px 18px;
  border: 3px solid var(--ink); border-radius: 14px; background: var(--paper); color: var(--ink); font-size: 17px; cursor: pointer;
  box-shadow: inset 0 -5px 0 rgba(20,32,61,.16), inset 0 3px 0 rgba(255,255,255,.6), 0 4px 0 var(--ink);
  transition: transform .08s, box-shadow .08s, filter .15s; touch-action: manipulation; white-space: nowrap; }
.btn:active { transform: translateY(3px); box-shadow: inset 0 -3px 0 rgba(20,32,61,.16), inset 0 2px 0 rgba(255,255,255,.6), 0 1px 0 var(--ink); }
.btn:focus-visible { outline: 3px solid var(--white); outline-offset: 3px; }
.btn:disabled, .btn.disabled { filter: grayscale(.8) brightness(.85); cursor: not-allowed; }
.btn .n { font-family: var(--font-ui); font-weight: 700; -webkit-text-stroke: 0; text-shadow: var(--outline); }
.btn.t, .btn .t { font-family: var(--font-display); color: var(--white); -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; letter-spacing: .02em; }
.btn-sun { background: var(--sun); }
.btn-leaf { background: var(--leaf); }
.btn-berry { background: var(--berry); }
.btn-blue { background: var(--blue); }
.btn-sun, .btn-leaf, .btn-berry, .btn-blue { font-family: var(--font-display); color: var(--white); -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; }
.btn-lg { min-height: 64px; font-size: 26px; border-radius: 18px; padding: 8px 26px; }
.btn-sm { min-height: 40px; font-size: 15px; padding: 4px 12px; border-radius: 12px; }
.btn-icon { width: 48px; padding: 0; }
.btn-icon .ic { width: 28px; height: 28px; }
.btn-sm.btn-icon { width: 40px; }
.btn-sm .ic { width: 22px; height: 22px; }
.btn-round { border-radius: 50%; width: 48px; height: 48px; padding: 0; }
.wiggle { animation: wiggle 2.2s ease-in-out infinite; }
@keyframes wiggle { 0%, 80%, 100% { transform: rotate(0) scale(1); } 85% { transform: rotate(-3deg) scale(1.04); } 90% { transform: rotate(3deg) scale(1.04); } 95% { transform: rotate(-2deg); } }

.panel { background: var(--paper); border: 3px solid var(--ink); border-radius: 18px; box-shadow: 0 5px 0 rgba(20,32,61,.55); }
.label { font-size: 13px; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }
.badge { position: absolute; top: -9px; right: -9px; min-width: 24px; height: 24px; padding: 0 6px; border-radius: 999px; background: var(--berry); border: 3px solid var(--ink);
  font-family: var(--font-display); font-size: 12px; line-height: 18px; color: #fff; -webkit-text-stroke: 0; text-align: center; animation: badge 1.4s ease-in-out infinite; }
@keyframes badge { 50% { transform: scale(1.15); } }

/* ---------------- Untere Navigation ---------------- */
.bottomnav { position: absolute; left: 0; right: 0; bottom: 0; z-index: 40; display: grid; grid-template-columns: repeat(5, 1fr); align-items: end;
  padding: 6px max(8px, var(--sal)) calc(var(--sab) + 6px) max(8px, var(--sar)); background: var(--sky-deep); border-top: 3px solid var(--ink); box-shadow: 0 -4px 0 rgba(20,32,61,.25); }
.nav-btn { position: relative; appearance: none; border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0; cursor: pointer; color: #cfe0ff; font-size: 11.5px; }
.nav-btn .ic { width: 34px; height: 34px; transition: transform .2s cubic-bezier(.2,2,.4,1); }
.nav-btn .nl { font-family: var(--font-ui); font-weight: 700; color: #fff; text-shadow: var(--outline); font-size: 12px; }
.nav-btn.on { background: var(--sky-hi); border: 3px solid var(--ink); border-radius: 14px; margin: -14px 2px 0; padding: 6px 0 4px; box-shadow: 0 4px 0 var(--ink); }
.nav-btn.on .ic { transform: scale(1.18) translateY(-2px); }
.nav-btn .badge { top: -6px; right: 12%; }

/* ---------------- Modals, Toasts, Banner ---------------- */
#modal-root { position: relative; z-index: 800; }
.modal-bg { position: fixed; inset: 0; background: rgba(20,32,61,.62); display: flex; align-items: center; justify-content: center;
  padding: calc(var(--sat) + 12px) 12px calc(var(--sab) + 12px); animation: fade-in calc(.18s * var(--speed)); }
@keyframes fade-in { from { opacity: 0; } }
.modal { position: relative; width: min(520px, 100%); max-height: 100%; overflow-y: auto; padding: 20px 18px 18px; background: var(--paper); border: 4px solid var(--ink); border-radius: 22px;
  box-shadow: 0 7px 0 var(--ink); animation: pop-in calc(.32s * var(--speed)) cubic-bezier(.2,1.6,.4,1); -webkit-overflow-scrolling: touch; }
.modal.wide { width: min(760px, 100%); }
@keyframes pop-in { from { transform: scale(.7); opacity: 0; } }
.modal-head { margin: -20px -18px 14px; padding: 12px 18px; background: var(--blue); border-bottom: 4px solid var(--ink); border-radius: 18px 18px 0 0; text-align: center; font-size: 24px; }
.modal p { margin: 6px 0; font-weight: 400; }
.modal-actions { display: flex; gap: 10px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }
.modal-actions .btn { flex: 1 1 120px; }
.modal-close { position: absolute; top: 8px; right: 8px; z-index: 2; }
.modal input[type=text], .modal textarea { width: 100%; padding: 12px; border-radius: 12px; border: 3px solid var(--ink); background: #fff; color: var(--ink); font-size: 18px; user-select: text; -webkit-user-select: text; }
.choice-list { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 8px; }
.choice { width: 96px; padding: 8px 4px; border-radius: 14px; background: #fff; border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink), inset 0 -5px 0 color-mix(in srgb, var(--rc, #ccc) 60%, transparent); cursor: pointer; text-align: center; font-size: 13px; }
.choice:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.choice svg { width: 64px; height: 64px; display: block; margin: 0 auto 2px; }

#toast-root { position: fixed; left: 50%; bottom: calc(var(--sab) + var(--nav-h) + 18px); transform: translateX(-50%); z-index: 950; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; width: min(92vw, 460px); }
.toast { padding: 10px 16px; border-radius: 14px; background: var(--ink); color: #fff; border: 3px solid #fff; font-size: 15px; text-align: center; animation: toast-in .35s cubic-bezier(.2,1.8,.4,1); }
.toast.out { opacity: 0; transform: translateY(10px) scale(.9); transition: all .25s; }
@keyframes toast-in { from { opacity: 0; transform: translateY(20px) scale(.8); } }

#banner-root { position: fixed; top: calc(var(--sat) + 70px); left: 0; right: 0; z-index: 870; pointer-events: none; display: flex; justify-content: center; }
.banner { position: relative; display: flex; align-items: center; gap: 10px; padding: 8px 26px 8px 10px; max-width: 92vw; background: var(--rc, var(--sun)); border: 4px solid var(--ink); border-radius: 16px;
  box-shadow: 0 5px 0 var(--ink); animation: banner-in calc(.45s * var(--speed)) cubic-bezier(.2,1.6,.4,1); transform-origin: 50% 0; }
.banner::before, .banner::after { content: ''; position: absolute; top: 12px; width: 22px; height: 70%; background: color-mix(in srgb, var(--rc, var(--sun)) 70%, #000); border: 4px solid var(--ink); z-index: -1; }
.banner::before { left: -16px; border-radius: 6px 0 0 6px; } .banner::after { right: -16px; border-radius: 0 6px 6px 0; }
.banner .b-icon { width: 52px; height: 52px; flex: none; margin-top: -14px; }
.banner .b-icon svg { width: 100%; height: 100%; }
.banner .b-title { font-size: 22px; line-height: 1.05; }
.banner .b-sub { font-size: 12px; color: var(--ink); }
.banner.out { animation: banner-out .25s ease-in forwards; }
@keyframes banner-in { 0% { transform: scale(.2) rotate(-8deg); opacity: 0; } 70% { transform: scale(1.06) rotate(1deg); } }
@keyframes banner-out { to { transform: translateY(-30px) scale(.8); opacity: 0; } }

.shake-s { animation: shake-s .3s; }
.shake-l { animation: shake-l .5s; }
@keyframes shake-s { 25% { transform: translate(-4px, 2px); } 50% { transform: translate(4px, -2px); } 75% { transform: translate(-2px, 1px); } }
@keyframes shake-l { 10% { transform: translate(-9px, 5px) rotate(-.6deg); } 25% { transform: translate(8px, -6px) rotate(.6deg); } 45% { transform: translate(-6px, -3px); } 65% { transform: translate(5px, 4px); } 85% { transform: translate(-2px, 2px); } }

/* ---------------- Startscreen (Kampf) ---------------- */
.home { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: space-evenly; gap: 10px; padding: 0 14px calc(var(--nav-h) + var(--sab) + 12px); }
.logo { text-align: center; line-height: .86; transform: rotate(-3deg); }
.logo .l1 { font-size: clamp(38px, 12vw, 70px); display: block; }
.logo .l2 { font-size: clamp(46px, 15vw, 88px); display: block; color: var(--sun); }
.logo-pcs { display: flex; justify-content: center; margin-bottom: -8px; }
.logo-pcs svg { width: clamp(38px, 11vw, 60px); height: clamp(38px, 11vw, 60px); margin: 0 -4px; }
.logo-pcs svg:nth-child(odd) { transform: translateY(6px) rotate(-8deg); } .logo-pcs svg:nth-child(even) { transform: rotate(6deg); }
.arena { position: relative; width: min(100%, 420px); padding: 12px 14px 14px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.arena-row { display: flex; align-items: center; gap: 10px; width: 100%; }
.arena-row .btn-icon { flex: none; }
.arena-mid { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; }
.avatar { position: relative; width: 74px; height: 74px; flex: none; border-radius: 22px; background: var(--bc, var(--blue)); border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink), inset 0 -6px 0 rgba(0,0,0,.15); overflow: hidden; }
.avatar svg { width: 100%; height: 100%; display: block; }
.avatar.sm { width: 42px; height: 42px; border-radius: 12px; box-shadow: 0 3px 0 var(--ink); }
.arena .bname { font-size: 20px; line-height: 1.1; }
.arena .btitle { font-size: 13px; color: var(--muted); }
.stars-row { display: flex; gap: 1px; margin-top: 2px; }
.stars-row .ic { width: 18px; height: 18px; }
.arena .reward { display: flex; align-items: center; gap: 4px; font-size: 17px; }
.arena .reward .ic { width: 24px; height: 24px; }
.arena.locked .arena-mid { filter: grayscale(.9); opacity: .55; }
.lockline { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--berry-dk); }
.lockline .ic { width: 22px; height: 22px; }
.deck-chip { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 8px 6px 12px; border-radius: 12px; background: var(--paper-2); border: 3px solid var(--ink); cursor: pointer; }
.deck-chip .dn { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dots { display: flex; gap: 6px; justify-content: center; }
.dots span { width: 10px; height: 10px; border-radius: 50%; background: var(--paper-3); border: 2px solid var(--ink); }
.dots span.on { background: var(--sun); transform: scale(1.25); }
.dots span.lk { background: #9aa6c2; }
.home-btns { display: flex; flex-direction: column; gap: 12px; width: min(100%, 420px); }
.home-btns .row { display: flex; gap: 10px; }
.home-btns .row .btn { flex: 1; }
.home-stats { display: flex; gap: 10px; }
.stat { display: flex; align-items: center; gap: 6px; padding: 4px 14px 4px 6px; border-radius: 999px; background: var(--sky-deep); border: 3px solid var(--ink); }
.stat .ic { width: 30px; height: 30px; }
.stat b { color: #fff; text-shadow: var(--outline); font-size: 19px; }
.stat span { color: #cfe0ff; font-size: 13px; }

/* Deck-Auswahl-Liste */
.deck-pick { display: flex; flex-direction: column; gap: 10px; }
.deck-pick .dp { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 14px; border: 3px solid var(--ink); background: #fff; cursor: pointer; }
.deck-pick .dp.on { background: var(--sun); }
.deck-pick .dp.bad { opacity: .55; }
.deck-pick .dp .mini-deck { width: 140px; flex: none; }
.mini-deck { display: grid; grid-template-columns: repeat(8, 1fr); border: 2px solid var(--ink); border-radius: 6px; overflow: hidden; }
.mini-deck .md { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; background: #f6e3b4; }
.mini-deck .md.d { background: #cf9452; }
.mini-deck svg { width: 100%; height: 100%; }

/* ---------------- Match ---------------- */
.game { padding-top: var(--sat); padding-bottom: var(--sab); }
.game-stage { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 6px; padding: 6px 8px 8px; }
.bar { flex: none; display: flex; align-items: center; gap: 8px; min-height: 52px; padding: 4px 6px 4px 4px; border-radius: 16px; background: rgba(20,32,61,.35); border: 3px solid var(--ink); }
.bar .who { min-width: 0; flex: 1; display: flex; flex-direction: column; }
.bar .nm { font-family: var(--font-ui); font-size: 17px; color: #fff; text-shadow: var(--outline); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.15; }
.bar .sub { font-size: 12px; color: #e6eeff; min-height: 16px; display: flex; align-items: center; gap: 4px; }
.bar.active { background: color-mix(in srgb, var(--tc) 55%, var(--ink)); box-shadow: 0 0 0 3px var(--tc); }
.team-dot { width: 42px; height: 42px; flex: none; border-radius: 12px; border: 3px solid var(--ink); background: var(--tc); box-shadow: 0 3px 0 var(--ink); display: grid; place-items: center; }
.team-dot svg { width: 38px; height: 38px; }
.caps { display: flex; align-items: center; flex-wrap: nowrap; overflow: hidden; }
.caps svg { width: 20px; height: 20px; margin-right: -6px; }
.caps .diff { margin-left: 10px; font-size: 13px; color: var(--sun); text-shadow: var(--outline); }
.sp-mini-row { display: flex; gap: 3px; flex: none; max-width: 46%; overflow: hidden; }
.sp-mini { width: 30px; height: 30px; border-radius: 9px; background: #fff; border: 2.5px solid var(--ink); display: grid; place-items: center; box-shadow: inset 0 -4px 0 var(--rc); }
.sp-mini svg { width: 26px; height: 26px; }
.sp-mini.used { opacity: .35; filter: grayscale(1); }
.think-dots { display: inline-flex; gap: 3px; }
.think-dots span { width: 7px; height: 7px; border-radius: 50%; background: var(--sun); border: 1.5px solid var(--ink); animation: dot .9s infinite; }
.think-dots span:nth-child(2) { animation-delay: .15s; } .think-dots span:nth-child(3) { animation-delay: .3s; }
@keyframes dot { 50% { transform: translateY(-4px); } }

.board-area { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; position: relative; }
.board-wrap { position: relative; aspect-ratio: 1; padding: 2.2%; border-radius: 16px; background: #8a5530; border: 4px solid var(--ink);
  box-shadow: inset 0 -6px 0 rgba(0,0,0,.25), inset 0 4px 0 rgba(255,255,255,.2), 0 7px 0 var(--ink); }
.board { position: relative; width: 100%; height: 100%; touch-action: none; }
.board .squares { position: absolute; inset: 0; border-radius: 6px; overflow: hidden; border: 3px solid var(--ink); }
.sq { position: absolute; width: 12.5%; height: 12.5%; }
.theme-sand { --sq-l: #f6e3b4; --sq-d: #cf9452; } .theme-sand.board-wrap { background: #8a5530; }
.theme-wiese { --sq-l: #e8f3c4; --sq-d: #77b255; } .theme-wiese.board-wrap { background: #4c7a35; }
.theme-eis { --sq-l: #eef6ff; --sq-d: #8fb2de; } .theme-eis.board-wrap { background: #4a6d9e; }
.sq.l { background: var(--sq-l); } .sq.d { background: var(--sq-d); }
.coord { position: absolute; font-size: clamp(8px, 2.2vw, 12px); font-weight: 700; pointer-events: none; opacity: .75; }
.coord.f { right: 5%; bottom: 1%; } .coord.r { left: 5%; top: 1%; }
.sq.l .coord { color: var(--sq-d); } .sq.d .coord { color: var(--sq-l); }
.sq::before, .sq::after { content: ''; position: absolute; pointer-events: none; }
.sq.last::before { inset: 0; background: rgba(255,214,79,.55); }
.sq.sel::before { inset: 0; background: rgba(255,200,61,.75); box-shadow: inset 0 0 0 4px var(--ink); }
.sq.check::before { inset: 0; background: var(--berry); animation: chk .8s steps(2) infinite; }
@keyframes chk { 50% { background: #ff9a8f; } }
.sq.hint-move::after { left: 34%; top: 34%; width: 32%; height: 32%; border-radius: 50%; background: rgba(20,32,61,.42); }
.sq.hint-cap::after { inset: 6%; border-radius: 50%; border: 5px solid rgba(20,32,61,.55); }
.sq.hint-sp::after { inset: 10%; border-radius: 50%; background: color-mix(in srgb, var(--hc) 40%, transparent); border: 4px solid var(--ink); box-shadow: inset 0 0 0 4px var(--hc); animation: sp-ring .8s ease-in-out infinite; }
@keyframes sp-ring { 50% { transform: scale(.82); } }
.sq.sp-from::before { inset: 0; background: color-mix(in srgb, var(--hc) 60%, transparent); }
.sq.aff::before { inset: 4%; border-radius: 12%; background: rgba(255,93,79,.55); box-shadow: inset 0 0 0 3px var(--ink); }
.sq.aff-good::before { inset: 4%; border-radius: 12%; background: rgba(255,200,61,.55); box-shadow: inset 0 0 0 3px var(--ink); }

.pc { position: absolute; width: 12.5%; height: 12.5%; z-index: 2; transition: left calc(.22s * var(--speed)) cubic-bezier(.3,.8,.3,1), top calc(.22s * var(--speed)) cubic-bezier(.3,.8,.3,1); touch-action: none; }
.pc .pc-inner { position: absolute; inset: 1% 4% 6%; transform-origin: 50% 92%; }
.pc .pc-inner svg { width: 100%; height: 100%; display: block; overflow: visible; }
.pc.lift { z-index: 5; }
.pc.lift .pc-inner { animation: lift .5s ease-in-out infinite alternate; }
@keyframes lift { from { transform: translateY(-6%) scale(1.08); } to { transform: translateY(-14%) scale(1.1); } }
.pc.dragging { z-index: 60; transition: none; }
.pc.dragging .pc-inner { transform: scale(1.3) translateY(-20%); }
.pc.flipped .pc-inner { transform: rotate(180deg); transform-origin: 50% 50%; }
.st-ice { position: absolute; inset: 6%; border-radius: 16%; pointer-events: none; background: rgba(191,233,255,.55); border: 3px solid var(--ink);
  box-shadow: inset 6px 6px 0 rgba(255,255,255,.7), inset -6px -6px 0 rgba(79,156,245,.35); animation: pop-in .35s cubic-bezier(.2,1.8,.4,1); }
.st-shield { position: absolute; inset: 0; border-radius: 50%; pointer-events: none; border: 3px solid var(--ink); background: rgba(255,210,63,.25);
  box-shadow: inset 0 0 0 4px rgba(255,210,63,.9); animation: shield-b 1.6s ease-in-out infinite; }
@keyframes shield-b { 50% { transform: scale(.92); } }
.st-num { position: absolute; right: 0; bottom: 2%; min-width: 34%; height: 34%; border-radius: 999px; display: grid; place-items: center; font-size: clamp(9px, 2.4vw, 13px); pointer-events: none; color: var(--ink); border: 2.5px solid var(--ink); }
.st-num.ice { background: var(--ice); } .st-num.shield { background: #ffd23f; right: auto; left: 0; }
.board-fx { position: absolute; inset: 0; pointer-events: none; z-index: 40; overflow: visible; }
.board-fx svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.fx-el { position: absolute; pointer-events: none; }

/* Spezialleiste */
.sp-strip { flex: none; display: flex; flex-direction: column; gap: 6px; }
.sp-bar { display: flex; gap: 8px; overflow-x: auto; overflow-y: hidden; padding: 4px 4px 8px; scroll-snap-type: x proximity; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.sp-bar::-webkit-scrollbar { display: none; }
.sp-card { position: relative; flex: none; width: 74px; height: 92px; padding: 4px 3px 3px; border-radius: 14px; background: #fff; border: 3px solid var(--ink);
  box-shadow: 0 4px 0 var(--ink), inset 0 -18px 0 color-mix(in srgb, var(--rc) 70%, #fff); text-align: center; cursor: pointer; scroll-snap-align: start; transition: transform .1s; }
.sp-card svg.pc-svg { width: 46px; height: 46px; display: block; margin: 0 auto; }
.sp-card .sp-name { font-size: 9.5px; line-height: 1.05; height: 22px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.sp-card .sp-st { position: absolute; left: 0; right: 0; bottom: 2px; display: flex; justify-content: center; }
.sp-card .sp-st .ic { width: 12px; height: 12px; }
.sp-card:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.sp-card.ready { animation: ready 1.4s ease-in-out infinite; }
@keyframes ready { 50% { transform: translateY(-3px); } }
.sp-card.aiming { background: var(--sun); transform: translateY(-6px) scale(1.06); animation: none; }
.sp-card.used, .sp-card.locked, .sp-card.blocked { background: #d8dce8; box-shadow: 0 4px 0 var(--ink); }
.sp-card.used svg.pc-svg, .sp-card.locked svg.pc-svg { filter: grayscale(1) opacity(.5); }
.sp-card .corner { position: absolute; top: -8px; right: -8px; width: 26px; height: 26px; }
.sp-card.waiting { opacity: .7; animation: none; }
.sp-act { display: flex; align-items: center; gap: 8px; min-height: 52px; padding: 4px 6px 4px 12px; border-radius: 16px; background: var(--paper); border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink); }
.sp-act .tx { flex: 1; min-width: 0; font-size: 13px; line-height: 1.2; }
.sp-act .tx b { font-size: 15px; }

/* Breite Bildschirme (Tablet quer, Desktop): Brett links, Leiste rechts */
.game.wide .game-stage { flex-direction: row; gap: 14px; padding: 10px 14px; }
.game.wide .board-area { flex: 1; }
.game.wide .side { width: min(360px, 38vw); flex: none; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
.game:not(.wide) .side { display: contents; }
.game:not(.wide) .movebox { display: none; }
.game:not(.wide) #bar-top { order: -1; }
.game:not(.wide) #bar-me, .game:not(.wide) #sp-act { order: 1; }
.game:not(.wide) #sp-bar { order: 2; }
.game.wide .sp-bar { flex-wrap: wrap; overflow: visible; }
.movebox { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 10px; }
.movelist { flex: 1; min-height: 0; overflow-y: auto; font-size: 13px; display: grid; grid-template-columns: 28px 1fr 1fr; gap: 2px 6px; align-content: start; font-weight: 400; }
.movelist .no { color: var(--muted); }
.movelist .mv { padding: 1px 4px; border-radius: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.movelist .mv.sp { background: var(--sun); font-weight: 700; }

/* Ergebnis */
.result { text-align: center; }
.result-title { font-size: clamp(40px, 13vw, 64px); line-height: 1; margin: 4px 0 6px; animation: slam calc(.55s * var(--speed)) cubic-bezier(.3,1.8,.5,1); }
.result-title.win { color: var(--sun); } .result-title.lose { color: #b8c3dd; } .result-title.draw { color: var(--ice); }
@keyframes slam { 0% { transform: scale(3) rotate(-10deg); opacity: 0; } 60% { transform: scale(.9) rotate(2deg); opacity: 1; } }
.ep-lines { margin: 12px auto 4px; max-width: 360px; text-align: left; display: flex; flex-direction: column; gap: 4px; }
.ep-line { display: flex; justify-content: space-between; gap: 10px; padding: 6px 10px; border-radius: 10px; background: #fff; border: 2.5px solid var(--ink); opacity: 0; animation: line-in .35s forwards cubic-bezier(.2,1.6,.4,1); font-size: 14px; }
.ep-line.total { background: var(--sun); font-size: 22px; align-items: center; }
.ep-line.total .ic { width: 30px; height: 30px; }
@keyframes line-in { from { opacity: 0; transform: translateX(-20px) scale(.9); } to { opacity: 1; transform: none; } }

/* ---------------- Automat ---------------- */
.slot-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 0 12px calc(var(--nav-h) + var(--sab) + 12px); }
.machine { position: relative; width: min(100%, 460px); padding: 14px 14px 16px; border-radius: 28px 28px 20px 20px; background: var(--berry); border: 4px solid var(--ink);
  box-shadow: inset 0 -10px 0 var(--berry-dk), inset 0 6px 0 rgba(255,255,255,.35), 0 8px 0 var(--ink); }

  <script>
/* =====================================================================
   GAMBIT JACKPOT - engine.js
   Reine Spiellogik ohne DOM. Zustand ist serialisierbar.
   Brett: Array(64), Index = rank*8 + file, a1 = 0, h8 = 63.
   ===================================================================== */
var GJ = globalThis.GJ = globalThis.GJ || {};
(function () {
  const E = GJ.E = {};
  const PC = () => GJ.PIECES;

  // ---------------- Grundhelfer ----------------
  E.sqName = sq => 'abcdefgh'[sq & 7] + ((sq >> 3) + 1);
  E.sqFromName = n => (n.charCodeAt(0) - 97) + (parseInt(n.slice(1), 10) - 1) * 8;
  E.opp = c => (c === 'w' ? 'b' : 'w');
  E.fwd = c => (c === 'w' ? 1 : -1);
  E.cheb = (a, b) => Math.max(Math.abs((a & 7) - (b & 7)), Math.abs((a >> 3) - (b >> 3)));
  E.lastRank = c => (c === 'w' ? 7 : 0);
  E.isRoyal = p => !!PC()[p.type].royal;
  E.cls = p => PC()[p.type].cls;
  E.value = t => PC()[t].value;
  // gegnerische Figur, die von Specials/Schlagen betroffen sein darf
  E.targetable = (t, c) => !!t && t.color !== c && !PC()[t.type].royal && !(t.shield > 0);

  // ---------------- Neues Spiel ----------------
  // opts: { white: layout, black: layout, levels:{w,b}, promo:{w,b} }
  E.newGame = function (opts) {
    const st = {
      board: new Array(64).fill(null), turn: 'w', ply: 0, ep: null, halfmove: 0,
      specialsUsed: { w: [], b: [] },
      levels: { w: Object.assign({}, opts.levels && opts.levels.w), b: Object.assign({}, opts.levels && opts.levels.b) },
      promo: { w: (opts.promo && opts.promo.w) || ['dame', 'turm', 'laeufer', 'springer'], b: (opts.promo && opts.promo.b) || ['dame', 'turm', 'laeufer', 'springer'] },
      captured: { w: [], b: [] }, history: [], repetition: {}, result: null, nextId: 1,
      unlimitedSpecials: !!opts.unlimitedSpecials,
      _undo: []
    };
    const place = (layout, color) => {
      for (const name in layout) {
        const type = layout[name];
        if (!type || !PC()[type]) continue;
        let sq = E.sqFromName(name);
        if (color === 'b') sq = (7 - (sq >> 3)) * 8 + (sq & 7);
        st.board[sq] = E.newPiece(st, type, color, false);
      }
    };
    place(opts.white || {}, 'w');
    place(opts.black || {}, 'b');
    E.recordPosition(st);
    return st;
  };
  E.newPiece = (st, type, color, moved) => ({ id: st.nextId++, type, color, moved: !!moved, frozen: 0, shield: 0 });

  E.serialize = st => JSON.stringify(st, (k, v) => (k === '_undo' || k === '_u' ? undefined : v));
  E.deserialize = s => { const st = JSON.parse(s); st._undo = []; return st; };
  E.clone = st => E.deserialize(E.serialize(st));

  // ---------------- Undo-geloggte Mutationen ----------------
  function setSq(st, sq, p) { st._u.sq.push(sq, st.board[sq]); st.board[sq] = p; }
  function upd(st, sq, ch) { const p = Object.assign({}, st.board[sq], ch); setSq(st, sq, p); return p; }
  E._setSq = setSq; E._upd = upd;

  E.capture = function (st, sq, fx, style) {
    const p = st.board[sq];
    if (!p) return;
    st.captured[p.color].push(p.type);
    setSq(st, sq, null);
    if (fx) fx.push({ t: 'capture', sq, piece: p, style: style || 'shatter' });
  };
  E.movePiece = function (st, from, to, fx, style) {
    const p = st.board[from];
    setSq(st, from, null);
    const np = Object.assign({}, p, { moved: true });
    setSq(st, to, np);
    if (fx) fx.push({ t: style || 'move', from, to, id: p.id });
    return np;
  };
  E.promote = function (st, sq, type, fx) {
    const p = st.board[sq];
    upd(st, sq, { type });
    if (fx) fx.push({ t: 'promote', sq, from: p.type, type, id: p.id });
  };
  E.autoPromote = function (st, sq, fx) {
    const p = st.board[sq];
    if (!p || E.cls(p) !== 'bauer' || (sq >> 3) !== E.lastRank(p.color)) return;
    const opts = st.promo[p.color];
    E.promote(st, sq, opts && opts.length ? opts[0] : 'dame', fx);
  };
  E.freeze = function (st, sq, n, fx) {
    const p = st.board[sq];
    if (!p) return;
    upd(st, sq, { frozen: Math.max(p.frozen || 0, n) });
    if (fx) fx.push({ t: 'freeze', sq, n });
  };
  E.shieldPiece = function (st, sq, n, fx) {
    const p = st.board[sq];
    if (!p || PC()[p.type].royal) return;
    upd(st, sq, { shield: Math.max(p.shield || 0, n) });
    if (fx) fx.push({ t: 'shield', sq, n });
  };
  E.swapPieces = function (st, a, b, shieldB, fx) {
    const pa = st.board[a], pb = st.board[b];
    setSq(st, a, Object.assign({}, pb, { moved: true, shield: shieldB ? Math.max(pb.shield || 0, shieldB) : pb.shield }));
    setSq(st, b, Object.assign({}, pa, { moved: true }));
    if (fx) fx.push({ t: 'swap', a, b, ida: pa.id, idb: pb.id });
    E.autoPromote(st, a, fx);
  };
  E.convertPiece = function (st, sq, color, fx) {
    upd(st, sq, { color, moved: true, frozen: 0, shield: 0 });
    if (fx) fx.push({ t: 'convert', sq });
    E.autoPromote(st, sq, fx);
  };
  E.transformPiece = function (st, sq, type, freeze, fx) {
    const p = st.board[sq];
    upd(st, sq, { type, moved: true, shield: 0, frozen: Math.max(p.frozen || 0, freeze || 0) });
    if (fx) fx.push({ t: 'transform', sq, from: p.type, type });
    if (freeze && fx) fx.push({ t: 'freeze', sq, n: freeze });
  };
  E.revivePiece = function (st, sq, color, type, fx) {
    const arr = st.captured[color].slice();
    const i = arr.indexOf(type);
    if (i >= 0) arr.splice(i, 1);
    st.captured[color] = arr;
    const p = E.newPiece(st, type, color, true);
    setSq(st, sq, p);
    if (fx) fx.push({ t: 'revive', sq, piece: p });
  };
  E.pushPromoVariants = function (st, c, to, move, out) {
    if ((to >> 3) === E.lastRank(c)) {
      for (const t of st.promo[c]) out.push(Object.assign({}, move, { promo: t }));
    } else out.push(move);
  };

  // ---------------- Angriffe ----------------
  function attacksSq(st, from, p, to) {
    const d = PC()[p.type].move;
    const df = (to & 7) - (from & 7), dr = (to >> 3) - (from >> 3);
    if (!df && !dr) return false;
    if (d.pawn) {
      const f = E.fwd(p.color);
      if (dr === f && (df === 1 || df === -1)) return true;

  };
})();

    }

    for (const c of ['w', 'b']) {
      const lv = st.levels[c] || {};

      for (const t in present[c]) {
        const l = lv[t] || 0;
        if (l > 0 && !st.specialsUsed[c].includes(t)) res += cfg.specialReserve * 100 * l;

  function victimValue(st, m) {
    if (m.kind === 'normal' && m.capture != null) { const t = st.board[m.capture]; return t ? PC()[t.type].value : 0; }

  function orderMoves(st, moves, ttKey, killers) {
    for (const m of moves) {
      let sc = 0;
      const k = E.moveKey(m);
      if (ttKey && k === ttKey) sc = 1e6;
      else {
        const vv = victimValue(st, m);
        if (m.kind === 'normal' && m.capture != null) sc = 10000 + vv * 100 - PC()[st.board[m.from].type].value * 10;
        else if (m.kind === 'special' && vv > 0) sc = 9000 + vv * 100;
        if (m.promo) sc += 8000 + PC()[m.promo].value * 10;

  };
  Search.prototype.genMoves = function (st, ply) {
    const ms = E.pseudoMoves(st, { specials: false });
    const sp = [];
    E.genSpecials(st, st.turn, sp);
    if (ply <= 1) { for (const m of sp) ms.push(m); }
    else { for (const m of sp) if (materialSpecial(m)) ms.push(m); }
    return ms;
  };
  Search.prototype.qsearch = function (st, alpha, beta, qd) {
    this.check();
    const stand = evaluate(st);
    if (stand >= beta) return stand;
    if (stand > alpha) alpha = stand;
    if (qd >= 6) return stand;
    const c = st.turn;
    const moves = orderMoves(st, E.pseudoMoves(st, { specials: false, capturesOnly: true }), null, null);

  };

    this.check();
    if (st.halfmove >= 100) return 0;
    if (depth <= 0) return this.cfg.quiescence ? this.qsearch(st, alpha, beta, 0) : evaluate(st);
    const a0 = alpha;
    let ttKey = null, h = 0;
    if (this.tt) {
      h = E.hash(st);
      const e = this.tt.get(h);
      if (e) {
        ttKey = e.best;
        if (e.depth >= depth) {
          if (e.flag === 0) return e.score;
          if (e.flag === 1 && e.score >= beta) return e.score;
          if (e.flag === -1 && e.score <= alpha) return e.score;
        }
      }

    const c = st.turn;

      E.unmakeMove(st);

      if (E.hasFrozen(st, c)) {
        E.makeMove(st, { kind: 'pass' }, null);
        const sc = -this.negamax(st, depth - 1, -beta, -alpha, ply + 1);
        E.unmakeMove(st);
        return sc;
      }
      return 0;
    }
    if (this.tt) {
      const flag = best <= a0 ? -1 : (best >= beta ? 1 : 0);
      this.tt.set(h, { depth, score: best, flag, best: bestKey });
      if (this.tt.size > 400000) this.tt.clear();
    }
    return best;
  };

  // ---------------- Öffentliche API ----------------
  // bot: Eintrag aus CONFIG.bots (depth, timeMs, quiescence, tt, randomChance, randomTop, noise)
  function think(state, bot, opts) {
    opts = opts || {};
    const t0 = Date.now();
    const st = E.clone(state);
    const cfg = Object.assign({ depth: 2, timeMs: 800, quiescence: false, tt: false, randomChance: 0, randomTop: 1, noise: 0 }, bot);
    if (opts.fast) { cfg.timeMs = Math.min(cfg.timeMs, 300); }
    const maxMs = Math.min(cfg.timeMs, GJ.CONFIG.ai.maxMs);
    const legal = E.legalMoves(st);
    if (!legal.length) return null;
    if (legal.length === 1) return { move: legal[0], score: 0, depth: 0, nodes: 0, ms: Date.now() - t0 };
    const S = new Search(cfg, t0 + maxMs);
    let scored = legal.map(m => ({ m, s: 0 }));
    orderMoves(st, legal, null, null);
    scored = legal.map(m => ({ m, s: m._o / 1000 }));
    let doneDepth = 0;
    for (let d = 1; d <= cfg.depth; d++) {
      try {
        let alpha = -INF;
        const res = [];
        for (const it of scored) {
          E.makeMove(st, it.m, null);
          const sc = -S.negamax(st, d - 1, -INF, -alpha, 1);
          E.unmakeMove(st);
          res.push({ m: it.m, s: sc });
          if (sc > alpha) alpha = sc;
        }
        res.sort((a, b) => b.s - a.s);
        scored = res;
        doneDepth = d;
        if (scored[0].s > MATE - 100) break;
      } catch (e) {
        if (e !== TIMEOUT) throw e;
        // Stack wiederherstellen
        while (st._undo.length) E.unmakeMove(st);
        break;
      }
    }
    // Auswahl
    let pick = scored[0];
    if (cfg.randomChance && Math.random() < cfg.randomChance) {
      const top = scored.slice(0, Math.max(1, cfg.randomTop));
      pick = top[Math.floor(Math.random() * top.length)];
    } else if (cfg.noise && doneDepth > 0) {
      const noisy = scored.map(x => ({ m: x.m, s: x.s + (Math.random() * 2 - 1) * cfg.noise }));
      noisy.sort((a, b) => b.s - a.s);
      pick = scored.find(x => x.m === noisy[0].m);
    }
    return { move: pick.m, score: pick.s, depth: doneDepth, nodes: S.nodes, ms: Date.now() - t0 };
  }

  function evalFor(state, color) {
    const st = E.clone(state);
    st.turn = color;
    return evaluate(st) / 100;
  }

  GJ.AI = { think, evaluate, evalFor };
})();

/* =====================================================================
   GAMBIT JACKPOT - save.js
   Spielstand, Profil, Export/Import, Migration.
   ===================================================================== */
var GJ = globalThis.GJ = globalThis.GJ || {};
(function () {
  const C = GJ.CONFIG;
  const S = GJ.Save = {};

  S.key = () => C.saveKey;

  S.defaults = function () {
    const levels = {};
    GJ.PIECE_ORDER.forEach(t => (levels[t] = 0));
    const decks = [];
    for (let i = 0; i < C.deck.slots; i++) decks.push({ name: i === 0 ? 'Klassisch' : 'Deck ' + (i + 1), layout: Object.assign({}, C.CLASSIC_DECK) });
    return {
      version: C.version,
      ep: C.economy.startEP,
      owned: GJ.STANDARD_TYPES.slice(),
      levels,
      decks,
      activeDeck: 0,
      botsBeaten: [],
      firstWins: [],
      stats: { wins: 0, losses: 0, draws: 0, streak: 0, bestStreak: 0, spins: 0, games: 0 },
      slot: { spinsSinceNew: 0, spinsSinceLegendary: 0 },
      settings: { volume: 0.6, muted: false, animSpeed: 'normal', shake: true, theme: 'sand', coords: true, hints: true, vibrate: true },
      tutorialDone: false,
      match: null,
      selectedBot: 0,
      mp: { names: { w: 'Blau', b: 'Rot' }, decks: { w: Object.assign({}, C.CLASSIC_DECK), b: Object.assign({}, C.CLASSIC_DECK) }, level: C.mp.defaultLevel, budget: C.mp.defaultBudget, rotate: true }
    };
  };

  S.migrate = function (d) {
    const def = S.defaults();
    const out = Object.assign({}, def, d);
    out.levels = Object.assign({}, def.levels, d.levels || {});
    out.stats = Object.assign({}, def.stats, d.stats || {});
    out.slot = Object.assign({}, def.slot, d.slot || {});
    out.settings = Object.assign({}, def.settings, d.settings || {});
    if (!['sand', 'wiese', 'eis'].includes(out.settings.theme)) out.settings.theme = 'sand';
    out.mp = Object.assign({}, def.mp, d.mp || {});
    out.mp.names = Object.assign({}, def.mp.names, (d.mp && d.mp.names) || {});
    out.mp.decks = Object.assign({}, def.mp.decks, (d.mp && d.mp.decks) || {});
    if (!Array.isArray(out.owned)) out.owned = def.owned;
    GJ.STANDARD_TYPES.forEach(t => { if (!out.owned.includes(t)) out.owned.push(t); });
    out.owned = out.owned.filter(t => GJ.PIECES[t]);
    if (!Array.isArray(out.decks)) out.decks = def.decks;
    while (out.decks.length < C.deck.slots) out.decks.push({ name: 'Deck ' + (out.decks.length + 1), layout: Object.assign({}, C.CLASSIC_DECK) });
    out.decks.forEach(dk => { for (const k in dk.layout) if (!out.owned.includes(dk.layout[k])) delete dk.layout[k]; });
    if (out.activeDeck >= out.decks.length) out.activeDeck = 0;
    out.version = C.version;
    return out;
  };

  S.load = function () {
    let d = null;
    try { const raw = localStorage.getItem(S.key()); if (raw) d = JSON.parse(raw); } catch (e) { console.warn('[GJ] Laden fehlgeschlagen', e); }
    S.d = d ? S.migrate(d) : S.defaults();
    return S.d;
  };
  S.save = function () {
    try { localStorage.setItem(S.key(), JSON.stringify(S.d)); } catch (e) { console.warn('[GJ] Speichern fehlgeschlagen', e); }
  };
  S.reset = function () {
    try { localStorage.removeItem(S.key()); } catch (e) { /* egal */ }
    S.d = S.defaults();
    S.save();
  };
  S.exportJSON = () => JSON.stringify(S.d, null, 2);
  S.importJSON = function (txt) {
    const d = JSON.parse(txt);
    if (!d || typeof d !== 'object' || !('ep' in d)) throw new Error('Kein gültiger Spielstand');
    S.d = S.migrate(d);
    S.save();
  };

  // ---------------- EP ----------------
  S.listeners = [];
  S.onEP = fn => S.listeners.push(fn);
  S.addEP = function (n) {
    const old = S.d.ep;
    S.d.ep = Math.max(0, S.d.ep + n);
    S.save();
    S.listeners.forEach(f => f(S.d.ep, old));
  };
  S.spendEP = function (n) {
    if (S.d.ep < n) return false;
    S.addEP(-n);
    return true;
  };

  // ---------------- Figuren & Upgrades ----------------
  S.owns = t => S.d.owned.includes(t);
  S.level = t => S.d.levels[t] || 0;
  S.upgradeCost = function (type) {
    const lvl = S.level(type);
    if (lvl >= 3) return null;
    const base = C.economy.upgradeCost[lvl];
    const f = C.rarity[GJ.PIECES[type].rarity].factor;
    return Math.round(base * f / 10) * 10;
  };
  S.realUpgradeCost = function (type, lvl) {
    const f = C.rarity[GJ.PIECES[type].rarity].factor;
    return Math.round(C.economy.upgradeCost[lvl] * f / 10) * 10;
  };
  S.upgrade = function (type) {
    const cost = S.upgradeCost(type);
    if (cost == null || !S.owns(type)) return false;
    if (!S.spendEP(cost)) return false;
    S.d.levels[type] = S.level(type) + 1;
    S.save();
    return true;
  };
  S.unlock = function (type) {
    if (S.owns(type)) return false;
    S.d.owned.push(type);
    S.save();
    return true;
  };
  S.spinCost = () => C.slot.spinCost;

  // ---------------- Decks ----------------
  S.activeDeck = () => S.d.decks[S.d.activeDeck] || S.d.decks[0];
  S.promoOptions = function () {
    return S.d.owned.filter(t => ['dame', 'turm', 'laeufer', 'springer'].includes(GJ.PIECES[t].cls))
      .sort((a, b) => GJ.PIECES[b].value - GJ.PIECES[a].value);
  };
  S.playerLevels = function () {
    const o = {};
    S.d.owned.forEach(t => (o[t] = S.level(t)));
    return o;
  };

  // ---------------- Bots ----------------
  S.botUnlocked = function (idx) {
    if (idx === 0) return true;
    return S.d.botsBeaten.includes(C.bots[idx - 1].id);
  };
})();

    this.el = document.createElement('div');
    this.el.className = 'board';
    this.sqWrap = document.createElement('div');
    this.sqWrap.className = 'squares';

      d.className = 'sq ' + ((f8(sq) + r8(sq)) % 2 ? 'l' : 'd');

    this.wrap.appendChild(this.el);

    this.bindInput();

  // vf/vr: sichtbare Spalte/Reihe (0 = links bzw. unten)

  B.layout = function () {
    const coords = !GJ.Save.d || GJ.Save.d.settings.coords;
    this.squares.forEach((d, sq) => {
      d.style.left = this.vf(sq) * 12.5 + '%';
      d.style.top = (7 - this.vr(sq)) * 12.5 + '%';
      d.querySelectorAll('.coord').forEach(c => c.remove());
      if (!coords) return;
      if (this.vr(sq) === 0) d.insertAdjacentHTML('beforeend', `<span class="coord f">${'abcdefgh'[f8(sq)]}</span>`);

  B.rect = function () { return this.el.getBoundingClientRect(); };
  B.sqSize = function () { return this.rect().width / 8; };
  B.center = function (sq) {

  // ---------------- Eingabe ----------------
  B.bindInput = function () {
    let down = null, dragging = false, dragEl = null;
    const o = this.opts;
    this.el.addEventListener('contextmenu', e => { e.preventDefault(); if (o.onRightClick) o.onRightClick(); });
    this.el.addEventListener('pointerdown', e => {
      if (e.button === 2) return;
      GJ.Audio.init();
      const sq = this.sqFromPoint(e.clientX, e.clientY);
      if (sq < 0) return;
      down = { sq, x: e.clientX, y: e.clientY, id: e.pointerId, can: o.canDrag ? o.canDrag(sq) : false };
      dragging = false;
    });
    window.addEventListener('pointermove', e => {
      if (down && down.id === e.pointerId) {
        if (!dragging && down.can && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 6) {
          dragging = true;
          dragEl = this.ids.get(this.sqId[down.sq]);
          if (dragEl) dragEl.classList.add('dragging');
          if (o.onDragStart) o.onDragStart(down.sq);
        }
        if (dragging && dragEl) {
          const r = this.rect(), s = r.width / 8;
          dragEl.style.left = (e.clientX - r.left - s / 2) + 'px';
          dragEl.style.top = (e.clientY - r.top - s / 2) + 'px';
          const over = this.sqFromPoint(e.clientX, e.clientY);
          if (o.onHover) o.onHover(over);
        }
        return;
      }
      // Vorschau für Specials (Maus)
      if (e.pointerType !== 'mouse' || !this.st || !document.body.contains(this.el)) return;
      if (o.onHover) o.onHover(this.sqFromPoint(e.clientX, e.clientY));
    });
    this.el.addEventListener('pointerleave', () => { if (o.onHover && !down) o.onHover(-1); });
    window.addEventListener('pointerup', e => {
      if (!down || down.id !== e.pointerId) return;
      const d = down; down = null;
      if (dragging) {
        dragging = false;
        if (dragEl) { dragEl.classList.remove('dragging'); this.setPos(dragEl, d.sq); }
        dragEl = null;
        const to = this.sqFromPoint(e.clientX, e.clientY);
        if (o.onDrop) o.onDrop(d.sq, to);
      } else if (o.onClick) {
        const sq = this.sqFromPoint(e.clientX, e.clientY);
        if (sq === d.sq) o.onClick(sq);
      }
    });
  };

  // =====================================================================
  //  Animationen
  // =====================================================================
  B.byId = function (id) { return this.ids.get(id); };
  B.elAt = function (sq) { const id = this.sqId[sq]; return id != null ? this.ids.get(id) : null; };
  B.svg = function () {
    const s = document.createElementNS(ns, 'svg');
    s.setAttribute('viewBox', '0 0 800 800');
    this.fxLayer.appendChild(s);
    return s;
  };
  B.fxDiv = function (sq, html, cls) {
    const d = document.createElement('div');
    d.className = 'fx-el ' + (cls || '');
    d.style.width = '12.5%'; d.style.height = '12.5%';
    this.setPos(d, sq);
    d.innerHTML = html || '';
    this.fxLayer.appendChild(d);
    return d;
  };
  function pieceColors(p) { return p ? COLS[p.color] : COLS.w; }

  // Schlag-Animation (Cartoon-Stil: Treffer-Blitz, POW-Stern, Figur fliegt raus)
  B.captureFx = async function (e, quick) {
    const el = this.byId(e.piece.id);
    const c = this.center(e.sq);
    const cols = pieceColors(e.piece);
    const style = e.style || 'shatter';
    if (el) { this.ids.delete(e.piece.id); el.style.zIndex = 70; }
    GJ.Audio.play('capture');
    GJ.UI && GJ.UI.buzz && GJ.UI.buzz(20);
    const inner = el && el.querySelector('.pc-inner');
    if (inner) await FX.anim(inner, [{ filter: 'brightness(1)', transform: 'scale(1)' }, { filter: 'brightness(4) saturate(0)', transform: 'scale(1.15, .85)' }, { filter: 'brightness(1)', transform: 'scale(1)' }], { duration: 120 });
    const dir = Math.random() < 0.5 ? -1 : 1;
    if (style === 'knock' || style === 'shatter' || style === 'slash') {
      FX.pow(c.x, c.y, { color: style === 'slash' ? '#ffffff' : '#ffc83d', size: c.s * (quick ? 1.1 : 1.5) });
      FX.burst(c.x, c.y, { n: quick ? 8 : 14, colors: cols.slice(0, 3), speed: 5, size: c.s * 0.12, shape: 'circle', gravity: 0.25, life: 34, up: 3 });
      if (style === 'slash') FX.burst(c.x, c.y, { n: 10, colors: ['#ffffff'], speed: 7, size: c.s * 0.06, shape: 'spark', gravity: 0, life: 16 });
      if (el) await FX.anim(el, [{ transform: 'none', opacity: 1 }, { transform: `translate(${dir * 40}%, -120%) rotate(${dir * 160}deg) scale(1.1)`, opacity: 1, offset: 0.35 }, { transform: `translate(${dir * 180}%, 220%) rotate(${dir * 520}deg) scale(.7)`, opacity: 0 }], { duration: 620, easing: 'cubic-bezier(.25,.1,.6,1)', fill: 'forwards' });
    } else if (style === 'dissolve') {
      FX.pow(c.x, c.y, { color: '#fff6a8', size: c.s * 1.3 });
      FX.burst(c.x, c.y, { n: 18, colors: ['#fff6a8', '#ffc83d', '#ffffff'], speed: 3, size: c.s * 0.1, gravity: -0.12, life: 45, shape: 'star' });
      if (el) await FX.anim(el, [{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateY(-60%) scale(.4) rotate(30deg)' }], { duration: 420, easing: 'ease-in', fill: 'forwards' });
    } else if (style === 'burn') {
      if (inner) await FX.anim(inner, [{ filter: 'brightness(1)' }, { filter: 'brightness(.25) saturate(0)' }], { duration: 180, fill: 'forwards' });
      FX.pow(c.x, c.y, { color: '#ff7a2f', size: c.s * 1.5 });
      FX.burst(c.x, c.y, { n: 18, colors: ['#ff7a2f', '#ffc83d', '#ff5d4f'], speed: 4, size: c.s * 0.11, gravity: -0.06, life: 40, shape: 'circle' });
      FX.puff(c.x, c.y - c.s * 0.2, { n: 5, size: c.s * 0.35, color: '#5c6380' });
      if (el) await FX.anim(el, [{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'scale(.3) translateY(30%)' }], { duration: 300, fill: 'forwards' });
    } else if (style === 'crush') {
      FX.puff(c.x, c.y + c.s * 0.3, { n: 6, size: c.s * 0.3, color: '#fff6dc' });
      if (el) await FX.anim(el, [{ transform: 'none' }, { transform: 'scale(1.3, .2) translateY(180%)', opacity: 0 }], { duration: 260, easing: 'ease-in', fill: 'forwards' });
    }
    if (el) el.remove();
  };

  // Hüpfer: Figuren springen statt zu gleiten (Squash & Stretch)
  B.hop = function (el, height) {
    const inner = el && el.querySelector('.pc-inner');
    if (!inner) return Promise.resolve();
    return FX.anim(inner, [
      { transform: 'translateY(0) scale(1, 1)' },
      { transform: 'translateY(0) scale(1.12, .86)', offset: 0.12 },
      { transform: `translateY(-${height || 34}%) scale(.92, 1.1)`, offset: 0.5 },
      { transform: 'translateY(0) scale(1.14, .84)', offset: 0.85 },
      { transform: 'translateY(0) scale(1, 1)' }
    ], { duration: 300, easing: 'ease-in-out' });
  };

  // Generische Ereignis-Abarbeitung
  B.runEvents = async function (evts, st) {
    for (const e of evts) {
      if (e.done) continue;
      e.done = true;
      if (e.t === 'move' || e.t === 'push' || e.t === 'fly') {
        const el = this.byId(e.id);
        if (el) { this.setPos(el, e.to); if (e.t !== 'push') this.hop(el); }
        if (e.t === 'push') { const c = this.center(e.to); FX.puff(c.x, c.y + c.s * 0.25, { n: 3, size: c.s * 0.22, color: '#f3e2b6' }); }
        else GJ.Audio.play('move');
        await FX.sleep(e.t === 'push' ? 200 : 260);
        if (e.t !== 'push') { const c = this.center(e.to); FX.puff(c.x, c.y + c.s * 0.38, { n: 2, size: c.s * 0.16, color: '#ffffff', spread: c.s * 0.5 }); }
      } else if (e.t === 'capture') {
        await this.captureFx(e);
      } else if (e.t === 'promote') {
        const el = this.byId(e.id), c = this.center(e.sq);
        if (el) {
          const col = st.board[e.sq] ? st.board[e.sq].color : 'w';
          const master = ((st.levels[col] || {})[e.type] || 0) >= 3;
          el.querySelector('.pc-inner').innerHTML = PC()[e.type].svg(col, master);
          el.dataset.key = '';
          FX.anim(el.querySelector('.pc-inner'), [{ transform: 'scale(.3) rotate(-30deg)' }, { transform: 'scale(1.35) rotate(8deg)' }, { transform: 'scale(1)' }], { duration: 480, easing: 'cubic-bezier(.2,1.6,.4,1)' });
        }
        FX.pow(c.x, c.y, { color: '#ffc83d', size: c.s * 1.8 });
        FX.burst(c.x, c.y, { n: 16, colors: ['#ffc83d', '#ffffff'], speed: 5, shape: 'star', size: c.s * 0.14, gravity: 0.15, up: 3 });
        GJ.Audio.play('upgrade');
        await FX.sleep(450);
      } else if (e.t === 'freeze') {
        const c = this.center(e.sq);
        FX.burst(c.x, c.y, { n: 6, colors: ['#ffffff', '#9fd8ff'], speed: 2.5, size: c.s * 0.1, shape: 'star', gravity: 0, life: 30 });
      } else if (e.t === 'shield') {
        const c = this.center(e.sq);
        FX.ring(c.x, c.y, { color: '#ffd23f', maxR: c.s * 0.55, dur: 22, width: 5 });
      } else if (e.t === 'castle') {
        GJ.Audio.play('castle');
      }
    }
  };

  // Hauptfunktion: Zug animieren (DOM zeigt noch die Stellung VOR dem Zug)
  B.playMove = async function (st, m, fx) {
    if (!FX.speed()) { this.render(st); return; }
    if (m.kind === 'special') {
      const anim = PC()[m.stype].special.anim;
      const fn = this['sp_' + anim];
      GJ.Audio.play('sp_' + anim);
      try { if (fn) await fn.call(this, st, m, fx); } catch (err) { console.warn('[GJ] Animationsfehler', err); }
    }
    await this.runEvents(fx, st);
  };

  // ---------- 1 Traktor ----------
  B.sp_tractor = async function (st, m, fx) {
    const mv = fx.find(e => e.t === 'move');
    const pawn = mv && this.byId(mv.id);
    const color = st.board[m.to] ? st.board[m.to].color : 'w';
    const rot = (color === 'w') !== this.flipped ? -90 : 90;
    const tractor = this.fxDiv(m.from, `<svg viewBox="0 0 100 100" style="width:100%;height:100%;transform:rotate(${rot}deg)">
      <rect x="18" y="38" width="44" height="26" rx="5" fill="#e03131" stroke="#7a0f0f" stroke-width="3"/>
      <rect x="44" y="20" width="22" height="24" rx="3" fill="#ffd43b" stroke="#7a5a0f" stroke-width="3"/><rect x="48" y="24" width="14" height="10" fill="#a5d8ff"/>
      <rect x="62" y="44" width="22" height="16" rx="3" fill="#e03131" stroke="#7a0f0f" stroke-width="3"/><rect x="26" y="26" width="5" height="14" fill="#555"/>
      <circle cx="34" cy="68" r="17" fill="#222" stroke="#000" stroke-width="3"/><circle cx="34" cy="68" r="7" fill="#ffd43b"/>
      <circle cx="76" cy="70" r="10" fill="#222" stroke="#000" stroke-width="3"/><circle cx="76" cy="70" r="4" fill="#ffd43b"/>
      <path d="M86 48 L96 40 M86 56 L98 56 M86 64 L96 72" stroke="#9aa3b5" stroke-width="4" stroke-linecap="round"/></svg>`);
    tractor.style.zIndex = 50;
    tractor.style.transition = `left ${0.17 * FX.speed()}s linear, top ${0.17 * FX.speed()}s linear`;
    await FX.anim(tractor, [{ transform: 'scale(0)' }, { transform: 'scale(1.15)' }, { transform: 'scale(1)' }], { duration: 280 });
    if (pawn) { pawn.style.transition = tractor.style.transition; pawn.style.zIndex = 49; }
    const dir = color === 'w' ? 8 : -8;
    for (let s = m.from + dir; ; s += dir) {
      this.setPos(tractor, s); if (pawn) this.setPos(pawn, s);
      const c = this.center(s);
      FX.burst(c.x, c.y + c.s * 0.35, { n: 8, colors: ['#c9b08a', '#a08a6a'], speed: 1.5, size: 10, shape: 'smoke', gravity: -0.02, life: 35 });
      await FX.sleep(170);
      const cap = fx.find(e => e.t === 'capture' && e.sq === s && !e.done);
      if (cap) { cap.done = true; this.captureFx(cap); FX.shake('s'); }
      if (s === m.to) break;
    }
    if (mv) mv.done = true;
    await FX.anim(tractor, [{ opacity: 1 }, { opacity: 0, transform: 'scale(.6)' }], { duration: 260, fill: 'forwards' });
    tractor.remove();
    if (pawn) { pawn.style.transition = ''; pawn.style.zIndex = ''; }
  };

  // ---------- 2 Doppelsprung ----------
  B.sp_doublejump = async function (st, m, fx) {
    const pid = st.board[m.to] && st.board[m.to].id;
    const el = this.byId(pid);
    for (const sq of m.picks) {
      const cap = fx.find(e => e.t === 'capture' && e.sq === sq && !e.done);
      if (el) {
        el.style.zIndex = 30;
        this.setPos(el, sq);
        FX.anim(el.querySelector('.pc-inner'), [{ transform: 'none' }, { transform: 'translateY(-45%) scale(1.35)' }, { transform: 'none' }], { duration: 330, easing: 'ease-in-out' });
      }
      await FX.sleep(300);
      const c = this.center(sq);
      FX.ring(c.x, c.y + c.s * 0.3, { color: '#c9b08a', maxR: c.s * 0.5, dur: 18, width: 4 });
      if (cap) { cap.done = true; await this.captureFx(cap, true); }
      await FX.sleep(80);
    }
    if (el) el.style.zIndex = '';
    fx.forEach(e => { if (e.t === 'move') e.done = true; });
  };

  // ---------- 3 Heiliger Strahl ----------
  B.sp_beam = async function (st, m, fx) {
    const s = this.svg();
    const a = this.local(m.from), b = this.local(m.data && m.data.end != null ? m.data.end : m.caps[m.caps.length - 1]);
    s.innerHTML = `<defs><linearGradient id="beamg" gradientUnits="userSpaceOnUse" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#ffe08a"/></linearGradient></defs>
      <line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#14203d" stroke-width="34" stroke-linecap="round"/>
      <line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#ffc83d" stroke-width="24" stroke-linecap="round"/>
      <line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="url(#beamg)" stroke-width="9" stroke-linecap="round"/>`;
    const len = Math.hypot(b.x - a.x, b.y - a.y);
    s.querySelectorAll('line').forEach(l => { l.style.strokeDasharray = len; l.style.strokeDashoffset = len; });
    s.querySelectorAll('line').forEach(l => FX.anim(l, [{ strokeDashoffset: len }, { strokeDashoffset: 0 }], { duration: 220, fill: 'forwards' }));
    FX.flash('#fff6c8', 0.25, 300);
    await FX.sleep(220);
    for (const e of fx.filter(e => e.t === 'capture')) { e.done = true; this.captureFx(e); }
    await FX.anim(s, [{ opacity: 1 }, { opacity: 0 }], { duration: 500, fill: 'forwards' });
    s.remove();
  };

  // ---------- 4 Rammbock ----------
  B.sp_ram = async function (st, m, fx) {
    const pid = st.board[m.to] && st.board[m.to].id;
    const el = this.byId(pid);
    const dist = Math.max(Math.abs(f8(m.to) - f8(m.from)), Math.abs(r8(m.to) - r8(m.from)));
    const vdx = Math.sign(this.vf(m.to) - this.vf(m.from)), vdy = Math.sign(this.vr(m.to) - this.vr(m.from));
    const step = (m.to - m.from) / dist;
    if (el) { el.style.transition = `left ${0.09 * FX.speed()}s linear, top ${0.09 * FX.speed()}s linear`; el.style.zIndex = 30; }
    await FX.anim(el, [{ transform: 'none' }, { transform: `translate(${-vdx * 12}%, ${vdy * 12}%)` }, { transform: 'none' }], { duration: 220 });
    for (let k = 1; k <= dist; k++) {
      const sq = m.from + step * k;
      if (el) this.setPos(el, sq);
      await FX.sleep(90);
      const cap = fx.find(e => e.t === 'capture' && e.sq === sq && !e.done);
      if (cap) {
        cap.done = true; this.captureFx(cap);
        const c = this.center(sq);
        FX.burst(c.x, c.y, { n: 22, colors: ['#8a5a2b', '#c08a4a', '#5a3a1a'], speed: 5, size: 5, shape: 'square', life: 35 });
        FX.shake('s');
      }
    }
    if (el) { el.style.transition = ''; el.style.zIndex = ''; }
    fx.forEach(e => { if (e.t === 'move') e.done = true; });
  };

  // ---------- 5 Frostnova ----------
  B.sp_frost = async function (st, m, fx) {
    const c = this.center(m.from);
    FX.ring(c.x, c.y, { color: '#8fd8ff', maxR: c.s * ((m.data.radius || 1) + 0.6), dur: 34, width: 10 });
    FX.ring(c.x, c.y, { color: '#ffffff', maxR: c.s * ((m.data.radius || 1) + 0.3), dur: 26, width: 4 });
    FX.burst(c.x, c.y, { n: 50, colors: ['#ffffff', '#8fd8ff', '#c8f0ff'], speed: 6, size: 4, shape: 'star', gravity: 0, life: 40, drag: 0.93 });
    FX.flash('#c8f0ff', 0.3, 350);
    await FX.sleep(380);
  };

  // ---------- 6 Königstausch ----------
  B.sp_swap = async function (st, m, fx) {
    const ev = fx.find(e => e.t === 'swap');
    const a = this.byId(ev.ida), b = this.byId(ev.idb);
    const ca = this.center(m.from), cb = this.center(m.to);
    [ca, cb].forEach(c => FX.burst(c.x, c.y, { n: 26, colors: ['#ffe08a', '#fff'], speed: 3, shape: 'star', size: 5, gravity: -0.03 }));
    await Promise.all([a, b].map(el => FX.anim(el, [{ transform: 'scale(1)', opacity: 1 }, { transform: 'scale(0) rotate(180deg)', opacity: 0 }], { duration: 300, fill: 'forwards' })));
    [a, b].forEach(el => { if (el) el.style.transition = 'none'; });
    if (a) this.setPos(a, m.to); if (b) this.setPos(b, m.from);
    await FX.sleep(60);
    [ca, cb].forEach(c => FX.ring(c.x, c.y, { color: '#ffe08a', maxR: c.s * 0.7, dur: 24 }));
    await Promise.all([a, b].map(el => FX.anim(el, [{ transform: 'scale(0) rotate(-180deg)', opacity: 0 }, { transform: 'scale(1)', opacity: 1 }], { duration: 320 })));
    [a, b].forEach(el => { if (el) el.style.transition = ''; });
    ev.done = true;
  };

  // ---------- 7 Rauchbombe ----------
  B.sp_smoke = async function (st, m, fx) {
    const c = this.center(m.from);
    FX.burst(c.x, c.y, { n: 40, colors: ['#9aa3b5', '#c9ced8', '#6f7789'], speed: 2.4, size: 22, shape: 'smoke', gravity: -0.02, life: 70, drag: 0.95, jitter: c.s * (m.data.radius || 1) * 1.5 });
    await FX.sleep(500);
  };

  // ---------- 8 Lanzenwurf ----------
  B.sp_lance = async function (st, m, fx) {
    const a = this.center(m.from), b = this.center(m.caps[0]);
    const ang = Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;
    const d = document.createElement('div');
    d.style.cssText = `position:fixed;left:${a.x}px;top:${a.y}px;width:${a.s * 0.9}px;height:${a.s * 0.12}px;margin:${-a.s * 0.06}px 0 0 ${-a.s * 0.45}px;z-index:880;pointer-events:none;`;
    d.innerHTML = `<svg viewBox="0 0 100 12" preserveAspectRatio="none" style="width:100%;height:100%"><rect x="0" y="4" width="78" height="4" fill="#8a5a2b"/><path d="M76 0 L100 6 L76 12 Z" fill="#dfe6f2" stroke="#666"/></svg>`;
    document.body.appendChild(d);
    const frames = [];
    for (let i = 0; i <= 8; i++) {
      const t = i / 8, x = (b.x - a.x) * t, y = (b.y - a.y) * t - Math.sin(Math.PI * t) * a.s * 1.1;
      const tilt = ang - Math.cos(Math.PI * t) * 35;
      frames.push({ transform: `translate(${x}px,${y}px) rotate(${tilt}deg)` });
    }
    await FX.anim(d, frames, { duration: 420, easing: 'linear', fill: 'forwards' });
    FX.shake('s');
    const cap = fx.find(e => e.t === 'capture');
    if (cap) { cap.done = true; this.captureFx(cap); }
    await FX.anim(d, [{ opacity: 1 }, { opacity: 0 }], { duration: 300, fill: 'forwards' });
    d.remove();
  };

  // ---------- 9 Wüstensturm ----------
  B.sp_sandstorm = async function (st, m, fx) {
    const c = this.center(m.from);
    for (let i = 0; i < 4; i++) {
      FX.burst(c.x, c.y, { n: 30, colors: ['#e3c48f', '#c9a46a', '#f2dcae'], speed: 4, size: 4, shape: 'circle', gravity: 0, life: 40, drag: 0.96, jitter: c.s * 0.6 });
      FX.ring(c.x, c.y, { color: '#e3c48f', maxR: c.s * 1.6, dur: 24, width: 6 });
      await FX.sleep(120);
    }
    FX.shake('s');
    for (const e of fx) if (e.t === 'push' || e.t === 'move') { const el = this.byId(e.id); if (el) this.setPos(el, e.to); e.done = true; }
    await FX.sleep(260);
  };

  // ---------- 10 Sturzflug ----------
  B.sp_dive = async function (st, m, fx) {
    const ev = fx.find(e => e.t === 'fly');
    const el = ev && this.byId(ev.id);
    if (!el) return;
    el.style.zIndex = 45;
    await FX.anim(el.querySelector('.pc-inner'), [{ transform: 'none' }, { transform: 'translateY(-40%) scale(1.6) rotate(-8deg)' }], { duration: 300, fill: 'forwards' });
    el.style.transition = `left ${0.5 * FX.speed()}s ease-in-out, top ${0.5 * FX.speed()}s ease-in-out`;
    this.setPos(el, ev.to);
    await FX.sleep(420);
    const cap = fx.find(e => e.t === 'capture');
    if (cap) { cap.done = true; this.captureFx(cap); }
    await FX.sleep(100);
