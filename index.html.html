  };

  M.leave = function () {
    if (M.mode !== 'bot' || M.over) { M.cleanup(); GJ.UI.go(M.mode === 'mp' ? 'mp' : 'home'); return; }
    M.cleanup();
    GJ.UI.go('home');
  };
  M.cleanup = function () { document.onkeydown = null; window.onresize = null; M.aborted = true; };

  // ---------------- Pause-Menü ----------------
  M.pause = function () {
    GJ.Audio.init();
    const s = GJ.Save.d.settings;
    const btns = [];
    if (!M.over) {
      if (M.mode === 'training') btns.push(['undo', 'Zug zurück', '', () => M.undo()], ['refresh', 'Specials auffüllen', '', () => { M.st.specialsUsed = { w: [], b: [] }; M.next(); }]);
      else btns.push(['draw', 'Remis anbieten', '', () => M.offerDraw()], ['flag', 'Aufgeben', 'btn-berry', () => M.resign()]);
    }
    btns.push(['codex', 'Zugliste', '', () => M.showMoves()]);
    btns.push([s.muted ? 'soundOff' : 'soundOn', s.muted ? 'Ton an' : 'Ton aus', '', () => { s.muted = !s.muted; GJ.Save.save(); GJ.Audio.applyVolume(); }]);
    btns.push(['home', M.mode === 'bot' && !M.over ? 'Pause: zum Menü' : 'Zum Menü', 'btn-blue', () => M.leave()]);
    const md = GJ.UI.modal({
      title: 'Pause',
      html: `<div style="display:flex;flex-direction:column;gap:10px">${btns.map((b, i) => `<button class="btn ${b[2]}" data-i="${i}">${ic(b[0])} ${b[1]}</button>`).join('')}</div>
        ${M.mode === 'bot' && !M.over ? '<p style="text-align:center;font-size:13px">Dein Match wird gespeichert und kann im Menü fortgesetzt werden.</p>' : ''}`,
      buttons: [{ label: `${ic('play')} Weiterspielen`, cls: 'btn-leaf' }]
    });
    md.querySelectorAll('[data-i]').forEach(b => GJ.UI.tap(b, () => { GJ.UI.closeModal(md); btns[+b.dataset.i][3](); }));
  };
  M.showMoves = function () {
    GJ.UI.modal({ title: 'Zugliste', closeX: true, html: `<div class="movelist" style="max-height:60vh">${M.movesHTML()}</div>`, buttons: [] });
  };

  // ---------------- Ablauf ----------------
  M.next = function (first) {
    if (M.aborted && !first) return;
    const { moves, result } = E.status(M.st);
    M.legal = moves;
    if (result) { M.refresh(); M.finish(result); return; }
    M.refresh();
    if (M.mode === 'bot' && M.st.turn === 'b') { M.botTurn(); return; }
    if (moves.length === 1 && moves[0].kind === 'pass') {
      M.busy = true;
      GJ.UI.banner({ title: 'Eingefroren!', sub: M.nameOf(M.st.turn) + ' muss aussetzen', color: '#9fd8ff', icon: 'snow' });
      const g = M.gen;
      setTimeout(() => { if (g === M.gen && !M.aborted) M.execute(moves[0]); }, 1300 * (FX.speed() || 0.3));
      return;
    }
    M.busy = false;
  };

  M.botTurn = async function () {
    const g = M.gen;
    M.busy = true;
    M.renderBars(true);
    await FX.rawSleep(60);
    if (M.aborted || g !== M.gen) return;
    const t0 = Date.now();
    const r = GJ.AI.think(M.st, M.bot);
    const wait = C.ai.minShowMs - (Date.now() - t0);
    if (wait > 0) await FX.rawSleep(wait);
    if (M.aborted || g !== M.gen || !r) return;
    await M.execute(r.move);
  };

  M.execute = async function (m) {
    const g = M.gen;
    M.busy = true;
    M.ui = { mode: 'idle' };
    M.showAct(false);
    M.view.marks({ last: M.lastMove });
    const st = M.st, color = st.turn;
    if (M.mode === 'training') M.snapshots.push(E.serialize(st));
    const san = E.san(st, m);
    if (m.kind === 'special') {
      const def = PC()[m.stype];
      GJ.UI.banner({ title: def.special.name, sub: M.nameOf(color) + ' · ' + def.name + ' · Stufe ' + (m.level || 1), color: GJ.hlColor(def.rarity), iconSVG: def.svg(color, (m.level || 1) >= 3) });
      GJ.UI.buzz(30);
      await FX.sleep(color === 'b' && M.mode === 'bot' ? 900 : 450);
      if (g !== M.gen) return;
    }
    const fx = [];
    E.makeMove(st, m, fx);
    st._undo = [];
    const check = E.inCheck(st, st.turn);
    st.history.push({ san: san + (check ? '+' : ''), color, sp: m.kind === 'special', key: E.moveKey(m), from: m.from, to: m.kind === 'special' ? (m.to !== m.from ? m.to : m.picks[0]) : (m.to != null ? m.to : m.from) });
    E.recordPosition(st);
    M.lastMove = m.kind === 'pass' ? null : [m.from, st.history[st.history.length - 1].to];
    await M.view.playMove(st, m, fx);
    if (M.aborted || g !== M.gen) return;
    if (check) { GJ.Audio.play('check'); GJ.UI.buzz(60); }
    // 1 gegen 1: Brett zum nächsten Spieler drehen
    if (M.mode === 'mp' && M.setup.rotate) {
      const want = M.flipFor();
      if (want !== M.view.flipped) {
        await FX.anim(M.view.wrap, [{ transform: 'scale(1) rotate(0)' }, { transform: 'scale(.86) rotate(90deg)', opacity: .6 }], { duration: 220, easing: 'ease-in' });
        M.view.setFlipped(want);
        M.view.render(st, { mine: M.human() });
        await FX.anim(M.view.wrap, [{ transform: 'scale(.86) rotate(-90deg)', opacity: .6 }, { transform: 'scale(1) rotate(0)' }], { duration: 260, easing: 'cubic-bezier(.2,1.5,.4,1)' });
      }
    }
    M.view.render(st, { mine: M.human() });
    if (M.mode === 'mp' && !M.over) GJ.UI.banner({ title: M.nameOf(st.turn) + ' ist dran', sub: 'Gerät weitergeben', color: TEAM[st.turn], iconSVG: PC().koenig.svg(st.turn, false), ms: 1000 });
    M.saveMatch();
    M.next();
  };

  M.saveMatch = function () {
    if (M.mode !== 'bot') return;
    GJ.Save.d.match = M.over ? null : { botId: M.bot.id, setup: M.setup, state: E.serialize(M.st) };
    GJ.Save.save();
  };

  // ---------------- Anzeige ----------------
  M.refresh = function () {
    const st = M.st;
    const chk = E.inCheck(st, st.turn) ? E.royalSq(st, st.turn) : -1;
    M.baseMarks = { last: M.lastMove, check: chk };
    if (M.ui.mode === 'special') M.updateSpecialMarks();
    else if (M.ui.mode === 'piece') M.selectPiece(M.ui.sel);
    else M.view.marks(M.baseMarks);
    M.renderSpecialBar();
    M.renderBars(false);
    const ml = document.getElementById('movelist');
    if (ml) { ml.innerHTML = M.movesHTML(); ml.scrollTop = ml.scrollHeight; }
  };
  M.movesHTML = function () {
    const H = M.st.history;
    let h = '', n = 1;
    H.forEach((x, i) => {
      if (x.color === 'w') h += `<div class="no">${n}.</div>`;
      else if (i === 0) h += `<div class="no">${n}.</div><div class="mv">...</div>`;
      h += `<div class="mv ${x.sp ? 'sp' : ''}">${x.san}</div>`;
      if (x.color === 'b') n++;
    });
    return h || '<div class="no" style="grid-column:1/-1">Noch keine Züge</div>';
  };
  // Spieler unten = wer gerade zieht (1 gegen 1) bzw. du (Bot)
  M.bottomColor = function () { return M.mode === 'bot' ? 'w' : M.st.turn; };
  M.renderBars = function (thinking) {
    const st = M.st, me = M.bottomColor(), op = E.opp(me);
    const capsHTML = c => {
      const list = st.captured[E.opp(c)].slice().sort((a, b) => PC()[b].value - PC()[a].value);
      const diff = E.material(st, c) - E.material(st, E.opp(c));
      return `<span class="caps">${list.map(t => PC()[t].svg(E.opp(c), false)).join('')}${diff > 0 ? `<span class="diff">+${+diff.toFixed(1)}</span>` : ''}</span>`;
    };
    const top = document.getElementById('bar-top'), bot = document.getElementById('bar-me');
    if (!top || !bot) return;
    const avatar = M.mode === 'bot' ? `<div class="avatar sm" style="--bc:${M.bot.color}">${GJ.avatarSVG(M.bot.id)}</div>` : `<div class="team-dot" style="--tc:${TEAM[op]}">${PC().koenig.svg(op, false)}</div>`;
    const think = thinking ? `<span class="think-dots"><span></span><span></span><span></span></span> denkt nach` : capsHTML(op);
    top.className = 'bar' + (st.turn === op && !M.over ? ' active' : '');
    top.style.setProperty('--tc', TEAM[op]);
    top.innerHTML = `<button class="btn btn-sm btn-icon btn-blue" id="btn-pause" aria-label="Pause">${ic('pause')}</button>${avatar}<div class="who"><div class="nm">${M.nameOf(op)}</div><div class="sub">${think}</div></div><div class="sp-mini-row" id="sp-mini"></div>`;
    GJ.UI.tap(document.getElementById('btn-pause'), () => M.pause());
    M.renderOppSpecials(op);
    bot.className = 'bar' + (st.turn === me && !M.over ? ' active' : '') + (M.ui.mode === 'special' ? ' hidden' : '');
    bot.style.setProperty('--tc', TEAM[me]);
    const turnTxt = M.over ? '' : st.turn === me ? (E.inCheck(st, me) ? 'Schach!' : 'Du bist dran') : '';
    bot.innerHTML = `<div class="team-dot" style="--tc:${TEAM[me]}">${PC().koenig.svg(me, false)}</div><div class="who"><div class="nm">${M.nameOf(me)}</div><div class="sub">${capsHTML(me)}</div></div>
      ${turnTxt ? `<div class="toon-sm" style="font-size:14px;flex:none;padding-right:6px">${turnTxt}</div>` : ''}
      ${M.mode === 'training' ? `<button class="btn btn-sm btn-icon" id="btn-undo" aria-label="Zug zurück">${ic('undo')}</button>` : ''}`;
    const ub = document.getElementById('btn-undo'); if (ub) GJ.UI.tap(ub, () => M.undo());
  };

  M.deckTypes = function (color) {
    const set = new Set();
    if (M.mode !== 'training') Object.values(color === 'w' ? M.setup.white : M.setup.black).forEach(t => set.add(t));
    for (let s = 0; s < 64; s++) { const p = M.st.board[s]; if (p && p.color === color) set.add(p.type); }
    return GJ.PIECE_ORDER.filter(t => set.has(t));
  };
  M.renderSpecialBar = function () {
    const bar = document.getElementById('sp-bar');
    if (!bar) return;
    const color = M.bottomColor();
    const mine = M.isHumanTurn() && M.st.turn === color;
    const info = E.specialInfo(M.st, color, mine ? M.legal : []);
    bar.innerHTML = '';
    for (const t of M.deckTypes(color)) {
      const def = PC()[t];
      if (!def.special) continue;
      const i = info(t);
      const card = document.createElement('button');
      const aiming = M.ui.mode === 'special' && M.ui.spType === t;
      card.className = 'sp-card ' + (aiming ? 'aiming' : i.state) + (!mine || M.busy ? ' waiting' : '');
      card.style.setProperty('--rc', GJ.hlColor(def.rarity));
      const corner = i.state === 'used' ? ic('check', 'corner') : i.state === 'locked' ? ic('lock', 'corner') : '';
      card.innerHTML = `${def.svg(color, i.lvl >= 3)}<div class="sp-name">${def.special.name}</div><div class="sp-st">${[1, 2, 3].map(k => ic(k <= i.lvl ? 'star' : 'starOff')).join('')}</div>${corner}`;
      card.setAttribute('aria-label', def.special.name);
      card.onclick = () => M.activateSpecial(t, i);
      bar.appendChild(card);
    }
  };
  M.renderOppSpecials = function (op) {
    const row = document.getElementById('sp-mini');
    if (!row) return;
    const info = E.specialInfo(M.st, op, []);
    row.innerHTML = '';
    for (const t of M.deckTypes(op)) {
      const def = PC()[t], i = info(t);
      if (i.state === 'locked') continue;
      const d = document.createElement('div');
      d.className = 'sp-mini ' + (i.state === 'used' ? 'used' : '');
      d.style.setProperty('--rc', GJ.hlColor(def.rarity));
      d.innerHTML = def.svg(op, i.lvl >= 3);
      row.appendChild(d);
    }
  };

  // ---------------- Eingabe: normale Züge ----------------
  M.legalFrom = sq => (M.legal || []).filter(m => (m.kind === 'normal' || m.kind === 'castle') && m.from === sq);
  M.canDrag = function (sq) {
    if (!M.isHumanTurn() || M.busy || M.ui.mode === 'special') return false;
    const p = M.st.board[sq];
    return !!p && p.color === M.human() && M.legalFrom(sq).length > 0;
  };
  M.selectPiece = function (sq) {
    const ms = M.legalFrom(sq);
    M.ui = { mode: 'piece', sel: sq };
    const hints = GJ.Save.d.settings.hints;
    const moves = [], caps = [];
    for (const m of ms) { if (m.kind === 'normal' && m.capture != null) caps.push(m.to); else moves.push(m.to); }
    M.view.marks(Object.assign({}, M.baseMarks, { sel: sq, moves: hints ? moves : [], caps: hints ? caps : [] }));
  };
  M.deselect = function () { M.ui = { mode: 'idle' }; M.view.marks(M.baseMarks); };
  M.onClick = function (sq) {
    GJ.Audio.init();
    if (!M.isHumanTurn() || M.busy) return;
    if (M.ui.mode === 'special') { M.specialClick(sq); return; }
    const p = M.st.board[sq];
    if (M.ui.mode === 'piece') {
      const ms = M.legalFrom(M.ui.sel).filter(m => m.to === sq);
      if (ms.length) { M.playNormal(ms); return; }
    }
    if (p && p.color === M.human()) {
      if (M.legalFrom(sq).length) { GJ.Audio.play('select'); GJ.UI.buzz(8); M.selectPiece(sq); }
      else { M.deselect(); if (p.frozen) GJ.UI.toast('Diese Figur ist eingefroren'); else GJ.Audio.play('deny'); }
      return;
    }
    M.deselect();
  };
  M.onDrop = function (from, to) {
    if (!M.isHumanTurn() || M.busy) return;
    const ms = M.legalFrom(from).filter(m => m.to === to);
    if (ms.length) M.playNormal(ms);
    else { if (to !== from && to >= 0) GJ.Audio.play('deny'); M.view.render(M.st, { mine: M.human() }); M.selectPiece(from); }
  };
  M.playNormal = function (ms) {
    if (ms.length === 1) { M.execute(ms[0]); return; }
    M.chooseMove(ms, 'Umwandlung', 'Wähle die neue Figur');
  };
  M.chooseMove = function (ms, title, text) {
    const color = M.human();
    const html = `<p style="text-align:center">${text}</p><div class="choice-list">${ms.map((m, i) => {
      const t = m.promo || (m.data && m.data.type) || m.stype;
      const def = PC()[t];
      return `<button class="choice" data-i="${i}" style="--rc:${GJ.hlColor(def.rarity)}">${def.svg(color, false)}${def.name}</button>`;
    }).join('')}</div>`;
    const md = GJ.UI.modal({ title, html, persistent: true, buttons: [{ label: 'Abbrechen', onClick: () => M.cancelSpecial() }] });
    md.querySelectorAll('.choice').forEach(c => GJ.UI.tap(c, () => { GJ.UI.closeModal(md); M.execute(ms[+c.dataset.i]); }));
  };

  // ---------------- Eingabe: Specials ----------------
  M.activateSpecial = function (type, info) {
    GJ.Audio.init();
    if (M.over) return;
    if (M.ui.mode === 'special' && M.ui.spType === type) { M.cancelSpecial(); return; }
    if (!M.isHumanTurn() || M.busy || M.st.turn !== M.bottomColor()) { GJ.UI.toast('Warte, bis du dran bist'); return; }
    if (info.state !== 'ready') { GJ.Audio.play('deny'); GJ.UI.toast(info.reason); return; }
    const cand = M.legal.filter(m => m.kind === 'special' && m.stype === type);
    const froms = [...new Set(cand.map(m => m.from))];
    M.ui = { mode: 'special', spType: type, cand, froms, from: froms.length === 1 ? froms[0] : null, picks: [], hover: -1 };
    GJ.Audio.play('select'); GJ.UI.buzz(10);
    M.showAct(true);
    M.updateSpecialMarks();
    M.renderSpecialBar();
  };
  M.showAct = function (on) {
    const act = document.getElementById('sp-act'), me = document.getElementById('bar-me');
    if (!act || !me) return;
    act.classList.toggle('hidden', !on);
    me.classList.toggle('hidden', on);
  };
  M.cancelSpecial = function () {
    if (M.ui.mode !== 'special' && M.ui.mode !== 'piece') return;
    M.ui = { mode: 'idle' };
    M.showAct(false);
    M.view.marks(M.baseMarks);
    M.renderSpecialBar();
  };
  function prefixOk(m, from, picks) {
    if (m.from !== from) return false;
    for (let i = 0; i < picks.length; i++) if (m.picks[i] !== picks[i]) return false;
    return true;
  }
  M.spMatching = function () { const u = M.ui; return u.cand.filter(m => prefixOk(m, u.from, u.picks)); };
  M.isSelfCentric = ms => ms.length > 0 && ms.every(m => m.picks.length === 1 && m.picks[0] === m.from);

  M.updateSpecialMarks = function () {
    const u = M.ui, def = PC()[u.spType], col = GJ.hlColor(def.rarity);
    const act = document.getElementById('sp-act');
    const btn = (label, cls, fn) => { const b = document.createElement('button'); b.className = 'btn btn-sm ' + (cls || ''); b.innerHTML = label; GJ.UI.tap(b, fn); act.appendChild(b); };
    act.innerHTML = '';
    const tx = document.createElement('div');
    tx.className = 'tx';
    act.appendChild(tx);
    if (u.from == null) {
      tx.innerHTML = `<b>${def.special.name}</b><br>Tippe die Figur an, die es auslösen soll.`;
      M.view.marks(Object.assign({}, M.baseMarks, { spFrom: u.froms, sp: u.froms, hc: col }));
      btn(ic('close'), 'btn-berry btn-icon', () => M.cancelSpecial());
      return;
    }
    const ms = M.spMatching();
    const self = M.isSelfCentric(ms);
    const next = [...new Set(ms.filter(m => m.picks.length > u.picks.length).map(m => m.picks[u.picks.length]))];
    const complete = ms.filter(m => m.picks.length === u.picks.length);
    const aff = [], good = [];
    const prev = self ? ms : (u.hover >= 0 ? ms.filter(m => m.picks[u.picks.length] === u.hover) : (complete.length && u.picks.length ? complete : []));
    for (const m of prev) {
      for (const q of new Set([...(m.caps || []), ...(m.affects || [])])) {
        const p = M.st.board[q];
        if (p && p.color === M.st.turn) good.push(q); else aff.push(q);
      }
      if (m.to !== m.from && !m.caps.includes(m.to)) good.push(m.to);
    }
    M.view.marks(Object.assign({}, M.baseMarks, { spFrom: [u.from], sp: self ? [] : next, aff, affGood: good, hc: col }));
    const desc = def.special.desc()[(ms[0] && ms[0].level ? ms[0].level : 1) - 1];
    if (self) {
      tx.innerHTML = `<b>${def.special.name}</b><br>${desc}`;
      btn(ic('close'), 'btn-berry btn-icon', () => M.cancelSpecial());
      btn(`${ic('bolt')} Los!`, 'btn-sun', () => M.resolveSpecial(true));
    } else {
      tx.innerHTML = `<b>${def.special.name}</b><br>${u.picks.length ? 'Nächstes Ziel antippen' : 'Ziel antippen'}`;
      tx.title = desc;
      btn(ic('close'), 'btn-berry btn-icon', () => M.cancelSpecial());
      if (complete.length && next.length) btn('Fertig', 'btn-sun', () => M.finishPicks());
    }
  };
  M.onHover = function (sq) {
    if (M.ui.mode !== 'special' || M.ui.from == null || M.ui.hover === sq) return;
    M.ui.hover = sq;
    M.updateSpecialMarks();
  };
  M.specialClick = function (sq) {
    const u = M.ui;
    if (u.from == null) {
      if (u.froms.includes(sq)) { u.from = sq; GJ.Audio.play('select'); M.updateSpecialMarks(); }
      else M.cancelSpecial();
      return;
    }
    const ms = M.spMatching();
    if (M.isSelfCentric(ms)) {
      if (sq === u.from) M.resolveSpecial(true);
      else if (u.froms.length > 1 && u.froms.includes(sq)) { u.from = sq; M.updateSpecialMarks(); }
      else M.cancelSpecial();
      return;
    }
    const next = new Set(ms.filter(m => m.picks.length > u.picks.length).map(m => m.picks[u.picks.length]));
    if (next.has(sq)) {
      // Auf Touch: erstes Antippen zeigt die Vorschau, zweites bestätigt
      if (u.hover !== sq && matchMedia('(hover: none)').matches && u.picks.length === 0 && ms.some(m => m.picks[0] === sq && ((m.caps && m.caps.length > 1) || (m.affects && m.affects.length > 1)))) {
        u.hover = sq; M.updateSpecialMarks(); return;
      }
      u.picks.push(sq); u.hover = -1; GJ.Audio.play('select'); M.resolveSpecial(false); return;
    }
    if (!u.picks.length && u.froms.length > 1 && u.froms.includes(sq)) { u.from = sq; M.updateSpecialMarks(); return; }
    M.cancelSpecial();
  };
  M.finishPicks = function () {
    const u = M.ui;
    const complete = M.spMatching().filter(m => m.picks.length === u.picks.length);
    if (complete.length === 1) M.execute(complete[0]);
    else if (complete.length > 1) M.chooseMove(complete, PC()[u.spType].special.name, 'Wähle eine Variante');
  };
  M.resolveSpecial = function (self) {
    const u = M.ui;
    const ms = M.spMatching();
    if (self) { if (ms.length === 1) M.execute(ms[0]); return; }
    const complete = ms.filter(m => m.picks.length === u.picks.length);
    const ext = ms.filter(m => m.picks.length > u.picks.length);
    if (!ext.length) {
      if (complete.length === 1) M.execute(complete[0]);
      else if (complete.length > 1) M.chooseMove(complete, PC()[u.spType].special.name, complete[0].promo ? 'Wähle die neue Figur' : 'Wer soll zurückkehren?');
      return;
    }
    M.updateSpecialMarks();
  };

  // ---------------- Aufgeben / Remis ----------------
  M.resign = function () {
    if (M.over) return;
    const who = M.mode === 'bot' ? 'w' : M.st.turn;
    GJ.UI.confirm('Aufgeben?', M.mode === 'bot' ? 'Bei Aufgabe gibt es keine EP.' : `${M.nameOf(who)} gibt auf und verliert.`, 'Aufgeben', () => M.finish({ winner: E.opp(who), reason: 'aufgabe' }), true);
  };
  M.offerDraw = function () {
    if (M.over) return;
    if (M.mode === 'mp') {
      const other = E.opp(M.st.turn);
      GJ.UI.modal({ title: 'Remis?', html: `<p style="text-align:center">${M.nameOf(M.st.turn)} bietet Remis an. ${M.nameOf(other)}, nimmst du an?</p>`, persistent: true,
        buttons: [{ label: 'Ablehnen', cls: 'btn-berry' }, { label: 'Annehmen', cls: 'btn-leaf', onClick: () => M.finish({ winner: null, reason: 'remis' }) }] });
      return;
    }
    const ev = GJ.AI.evalFor(M.st, 'b');
    if (ev <= C.ai.acceptDrawBelow) { GJ.UI.toast(M.bot.name + ' nimmt das Remis an'); M.finish({ winner: null, reason: 'remis' }); }
    else { GJ.Audio.play('deny'); GJ.UI.toast(M.bot.name + ' lehnt ab. Die Stellung ist gut für den Bot.'); }
  };

  // ---------------- Spielende ----------------
  M.computeRewards = function (result) {
    const S = GJ.Save, eco = C.economy, bot = M.bot, base = bot.ep;
    const won = result.winner === 'w', lost = result.winner === 'b';
    const lines = [];
    if (won) {
      lines.push(['Sieg gegen ' + bot.name, base]);
      const pm = M.st.history.filter(h => h.color === 'w').length;
      if (result.reason === 'matt' && pm <= eco.fastMateMoves) lines.push([`Schnelles Matt (${pm} Züge)`, Math.round(base * eco.fastMateBonus)]);
      const streak = S.d.stats.streak;
      if (streak > 0) { const b = Math.min(streak * eco.streakBonusPerWin, eco.streakBonusMax); lines.push([`Siegesserie ${streak + 1}`, Math.round(base * b)]); }
      if (!S.d.firstWins.includes(bot.id)) lines.push(['Erster Sieg gegen ' + bot.name, eco.firstWinBonus]);
    } else if (!lost) lines.push(['Remis', Math.round(base * eco.drawFactor)]);
    else if (result.reason === 'aufgabe') lines.push(['Aufgegeben', eco.resignEP]);
    else lines.push(['Trostpreis', eco.lossEP]);
    return { lines, total: lines.reduce((a, l) => a + l[1], 0) };
  };

  M.finish = function (result) {
    if (M.over) return;
    M.over = true;
    M.busy = true;
    M.st.result = result;
    M.cancelSpecial();
    M.renderBars(false);
    const S = GJ.Save;
    if (M.mode !== 'bot') {
      const t = result.winner ? `${M.nameOf(result.winner)} gewinnt!` : 'Remis!';
      if (result.winner) { GJ.Audio.play('win'); FX.confetti(140); } else GJ.Audio.play('draw');
      const btns = M.mode === 'mp'
        ? [{ label: `${ic('refresh')} Revanche`, cls: 'btn-sun', onClick: () => M.start({ mp: true }) }, { label: `${ic('deck')} Decks`, cls: 'btn-blue', onClick: () => GJ.UI.go('mp') }, { label: `${ic('home')} Menü`, onClick: () => GJ.UI.go('home') }]
        : [{ label: `${ic('undo')} Zurück`, onClick: () => { M.over = false; M.busy = false; M.undo(); } }, { label: 'OK', cls: 'btn-leaf', onClick: () => { M.busy = false; } }];
      setTimeout(() => GJ.UI.modal({ cls: 'result', persistent: true, html: `<div class="result-title toon ${result.winner ? 'win' : 'draw'}">${t}</div><p>${M.REASONS[result.reason]}</p>`, buttons: btns }), 600 * (FX.speed() || 0.3));
      return;
    }
    const won = result.winner === 'w', lost = result.winner === 'b';
    const rw = M.computeRewards(result);
    const st = S.d.stats;
    let unlocked = null;
    if (won) {
      st.wins++; st.streak++; st.bestStreak = Math.max(st.bestStreak, st.streak);
      if (!S.d.botsBeaten.includes(M.bot.id)) {
        S.d.botsBeaten.push(M.bot.id);
        if (M.botIdx + 1 < C.bots.length) { unlocked = C.bots[M.botIdx + 1]; S.d.selectedBot = M.botIdx + 1; }
      }
      if (!S.d.firstWins.includes(M.bot.id)) S.d.firstWins.push(M.bot.id);
    } else if (lost) { st.losses++; st.streak = 0; } else { st.draws++; st.streak = 0; }
    S.d.match = null;
    S.save();
    setTimeout(() => M.showResult(result, rw, unlocked), result.reason === 'aufgabe' ? 100 : 700 * (FX.speed() || 0.3));
  };

  M.showResult = function (result, rw, unlocked) {
    const won = result.winner === 'w', lost = result.winner === 'b';
    const cls = won ? 'win' : lost ? 'lose' : 'draw';
    const title = won ? 'SIEG!' : lost ? 'VERLOREN' : 'REMIS';
    const sub = won ? 'Du hast ' + M.bot.name + ' besiegt' : lost ? M.REASONS[result.reason] + ' · ' + M.bot.name + ' gewinnt' : M.REASONS[result.reason];
    let lines = rw.lines.map((l, i) => `<div class="ep-line" style="animation-delay:${0.4 + i * 0.3}s"><span>${l[0]}</span><b>+${l[1]}</b></div>`).join('');
    lines += `<div class="ep-line total" style="animation-delay:${0.4 + rw.lines.length * 0.3}s"><span>Gesamt</span><span>${ic('coin')} <span id="ep-total">0</span></span></div>`;
    if (unlocked) lines += `<div class="ep-line" style="animation-delay:${0.7 + rw.lines.length * 0.3}s;background:var(--leaf)"><span>Neuer Gegner frei: ${unlocked.name}</span>${ic('crown')}</div>`;
    const md = GJ.UI.modal({
      cls: 'result', persistent: true,
      html: `<div class="result-title toon ${cls}">${title}</div><div style="font-size:14px">${sub}</div><div class="ep-lines">${lines}</div>`,
      buttons: [
        { label: `${ic('refresh')} Nochmal`, onClick: () => M.start({ botIdx: M.botIdx, deckIdx: M.setup.deckIdx }) },
        { label: `${ic('slot')} Automat`, cls: 'spin-go', onClick: () => GJ.UI.go('slot') },
        { label: `${ic('home')} Menü`, cls: 'btn-leaf', onClick: () => GJ.UI.go('home') }
      ]
    });
    if (won) { GJ.Audio.play('win'); FX.confetti(180); GJ.UI.buzz(80); } else GJ.Audio.play(lost ? 'lose' : 'draw');
    const totalEl = md.querySelector('#ep-total');
    setTimeout(async () => {
      if (rw.total > 0) {
        await FX.countUp(totalEl, 0, rw.total, 700);
        GJ.Save.addEP(rw.total);
      } else totalEl.textContent = '0';
      const sb = md.querySelector('.spin-go');
      if (sb && GJ.Save.d.ep >= GJ.Save.spinCost()) sb.classList.add('btn-sun', 'wiggle');
    }, (400 + rw.lines.length * 300) * (FX.speed() || 0.2));
  };

  // ---------------- Trainingsplatz ----------------
  M.undo = function () {
    if (M.mode !== 'training' || !M.snapshots.length) return;
    M.st = E.deserialize(M.snapshots.pop());
    M.over = false; M.busy = false;
    const h = M.st.history[M.st.history.length - 1];
    M.lastMove = h ? [h.from, h.to] : null;
    M.ui = { mode: 'idle' };
    M.view.render(M.st, { mine: M.human() });
    M.next();
  };
})();

</script>
  <script>
/* =====================================================================
   GAMBIT JACKPOT - deck.js
   Deck-Editor und Deck-Prüfung. Zwei Modi:
   - normal: deine 5 Decks, nur freigeschaltete Figuren, Budget 40
   - 1 gegen 1: alle 18 Figuren, Budget frei wählbar, keine Exemplar-Limits
   Bedienung: Karte antippen, dann Feld antippen. Mit Maus auch Ziehen.
   Figuren auf dem Brett lassen sich ziehen/tauschen, raus ziehen = entfernen.
   ===================================================================== */
var GJ = globalThis.GJ = globalThis.GJ || {};
(function () {
  const C = GJ.CONFIG;
  const PC = () => GJ.PIECES;
  const D = GJ.Deck = {};
  const ic = (n, c) => GJ.icon(n, c);
  const FILES = 'abcdefgh';

  // ---------------- Validierung ----------------
  // opts: { budget (0 = kein Limit), free (keine Exemplar-Limits) }
  D.validate = function (layout, checkOwned, opts) {
    opts = opts || {};
    const budget = opts.budget != null ? opts.budget : C.deck.budget;
    const errors = [], hints = [];
    let cost = 0, value = 0, count = 0;
    const counts = {}, royals = [];
    for (const n in layout) {
      const t = layout[n];
      const def = PC()[t];
      if (!def) { errors.push('Unbekannte Figur auf ' + n); continue; }
      if (checkOwned && !GJ.Save.owns(t)) errors.push(def.name + ' ist nicht freigeschaltet');
      cost += def.cost; value += def.value; count++;
      counts[t] = (counts[t] || 0) + 1;
      if (def.royal) royals.push(n);
    }
    if (!royals.length) errors.push('Kein König im Deck (König, Wächter oder Kaiser)');
    if (royals.length > 1) errors.push('Nur ein König erlaubt');
    if (budget && cost > budget) errors.push(`Budget um ${cost - budget} überschritten`);
    if (!opts.free) for (const t in counts) {
      const max = C.deck.maxCopies[PC()[t].rarity];
      if (counts[t] > max) errors.push(`${PC()[t].name} höchstens ${max}x`);
    }
    const isCls = (n, c) => layout[n] && PC()[layout[n]] && PC()[layout[n]].cls === c;
    if (!isCls('e1', 'koenig')) hints.push('Keine Rochade: auf e1 steht kein König');
    else {
      if (!isCls('h1', 'turm')) hints.push('Keine kurze Rochade: auf h1 fehlt die Turm-Klasse');
      if (!isCls('a1', 'turm')) hints.push('Keine lange Rochade: auf a1 fehlt die Turm-Klasse');
    }
    if (FILES.split('').some(f => isCls(f + '1', 'bauer'))) hints.push('Bauern auf Reihe 1 haben keinen Doppelschritt');
    const types = GJ.PIECE_ORDER.filter(t => counts[t]);
    return { valid: !errors.length, errors, hints, cost, value, count, counts, types, budget };
  };

  // ---------------- Editor-Zustand ----------------
  let ED = null;
  const isMP = () => ED && ED.mp;
  function layout() { return isMP() ? GJ.Save.d.mp.decks[ED.mp] : GJ.Save.d.decks[ED.idx].layout; }
  function setLayout(l) { if (isMP()) GJ.Save.d.mp.decks[ED.mp] = l; else GJ.Save.d.decks[ED.idx].layout = l; }
  function vopts() { return isMP() ? { budget: GJ.Save.d.mp.budget, free: true } : {}; }
  function owns(t) { return isMP() || GJ.Save.owns(t); }
  function lvl(t) { return isMP() ? GJ.Save.d.mp.level : GJ.Save.level(t); }
  function color() { return isMP() ? ED.mp : 'w'; }
  function snapshot() { ED.undo.push(JSON.stringify(layout())); if (ED.undo.length > 80) ED.undo.shift(); ED.redo = []; }
  function commit(sound) { GJ.Save.save(); D.renderBoard(); D.renderInfo(); D.renderCollection(); if (sound) GJ.Audio.play(sound); }

  D.place = function (type, name, fromName) {
    const L = layout();
    const def = PC()[type];
    if (!isMP()) {
      const v = D.validate(L);
      const already = (v.counts[type] || 0) - (L[name] === type ? 1 : 0);
      const max = C.deck.maxCopies[def.rarity];
      if (!fromName && already >= max) { GJ.Audio.play('deny'); GJ.UI.toast(`${def.name}: höchstens ${max}x pro Deck`); return false; }
    }
    snapshot();
    if (fromName) {
      const other = L[name];
      L[name] = type;
      if (other) L[fromName] = other; else delete L[fromName];
    } else {
      if (def.royal) for (const n in L) if (n !== name && PC()[L[n]].royal) { delete L[n]; GJ.UI.toast('Nur ein König erlaubt, der alte ist raus'); }
      L[name] = type;
    }
    ED.pop = name;
    GJ.UI.buzz(10);
    commit('move');
    return true;
  };
  D.clearSq = function (name) {
    const L = layout();
    if (!L[name]) return;
    snapshot();
    delete L[name];
    commit('pop');
  };

  // opts: { mp: 'w'|'b' } für 1 gegen 1
  D.open = function (opts) {
    opts = opts || {};
    const S = GJ.Save;
    GJ.UI.current = 'deck';
    ED = { mp: opts.mp || null, idx: S.d.activeDeck, undo: [], redo: [], hand: null, handFrom: null, fCls: 'all', fRar: 'all', sort: 'cost', pop: null };
    const title = isMP() ? 'Deck: ' + S.d.mp.names[ED.mp] : 'Deck';
    const body = `
      ${isMP() ? '' : '<div class="deck-tabs" id="tabs"></div>'}
      <div id="budget"></div>
      <div><div class="deck-ghost" id="ghost"></div><div class="deck-board" id="dboard"></div></div>
      <div id="dinfo" style="display:flex;flex-direction:column;gap:10px"></div>
      <div class="coll-bar">
        <select id="fcls" aria-label="Klasse"><option value="all">Alle Klassen</option>${Object.keys(GJ.CLASS_NAMES).map(k => `<option value="${k}">${GJ.CLASS_NAMES[k]}</option>`).join('')}</select>
        <select id="frar" aria-label="Seltenheit"><option value="all">Alle Seltenheiten</option>${Object.keys(C.rarity).map(k => `<option value="${k}">${C.rarity[k].name}</option>`).join('')}</select>
        <select id="fsort" aria-label="Sortierung"><option value="cost">Nach Kosten</option><option value="rarity">Nach Seltenheit</option><option value="cls">Nach Klasse</option></select>
      </div>
      <div class="collection" id="coll"></div>`;
    if (isMP()) {
      const app = document.getElementById('app');
      app.innerHTML = `<div class="screen">${GJ.UI.topbarHTML(title, true)}<div class="main"><div class="wrap">${body}<button class="btn btn-sun btn-lg" id="done">${ic('check')} Fertig</button></div></div></div>`;
      GJ.UI.bindTopbar(app, () => GJ.UI.go('mp'));
      GJ.UI.tap(document.getElementById('done'), () => GJ.UI.go('mp'));
    } else GJ.UI.shell('deck', title, body);
    let gh = '';
    for (let r = 5; r >= 3; r--) for (let f = 0; f < 8; f++) gh += `<div style="background:${(f + r) % 2 ? '#cf9452' : '#f6e3b4'}"></div>`;
    document.getElementById('ghost').innerHTML = gh;
    document.getElementById('fcls').onchange = e => { ED.fCls = e.target.value; D.renderCollection(); };
    document.getElementById('frar').onchange = e => { ED.fRar = e.target.value; D.renderCollection(); };
    document.getElementById('fsort').onchange = e => { ED.sort = e.target.value; D.renderCollection(); };
    document.onkeydown = e => {
      if (!(e.ctrlKey || e.metaKey)) { if (e.key === 'Escape') D.setHand(null); return; }
      const k = e.key.toLowerCase();
      if (k === 'z' && !e.shiftKey) { e.preventDefault(); D.undo(); }
      if (k === 'y' || (k === 'z' && e.shiftKey)) { e.preventDefault(); D.redo(); }
    };
    D.bindBoard();
    D.renderAll();
  };
  GJ.UI = GJ.UI || {}; GJ.UI.screens = GJ.UI.screens || {};
  GJ.UI.screens.deck = () => D.open();

  D.renderAll = function () { D.renderTabs(); D.renderBoard(); D.renderInfo(); D.renderCollection(); };
  D.undo = function () { if (!ED.undo.length) return; ED.redo.push(JSON.stringify(layout())); setLayout(JSON.parse(ED.undo.pop())); commit('click'); };
  D.redo = function () { if (!ED.redo.length) return; ED.undo.push(JSON.stringify(layout())); setLayout(JSON.parse(ED.redo.pop())); commit('click'); };

  D.renderTabs = function () {
    const t = document.getElementById('tabs');
    if (!t) return;
    const S = GJ.Save;
    t.innerHTML = '';
    S.d.decks.forEach((dk, i) => {
      const v = D.validate(dk.layout, true);
      const b = document.createElement('button');
      b.className = 'deck-tab' + (i === ED.idx ? ' cur' : '');
      b.innerHTML = `<span>${dk.name}</span>${i === S.d.activeDeck ? ic('check') : ''}${v.valid ? '' : ic('info')}`;
      GJ.UI.tap(b, () => { if (ED.idx === i) { D.rename(); return; } ED.idx = i; ED.undo = []; ED.redo = []; ED.hand = null; ED.handFrom = null; D.renderAll(); });
      t.appendChild(b);
    });
  };
  D.rename = function () {
    const dk = GJ.Save.d.decks[ED.idx];
    const md = GJ.UI.modal({
      title: 'Deck umbenennen', html: `<input type="text" id="dname" maxlength="20" value="${dk.name.replace(/"/g, '&quot;')}" aria-label="Name">`,
      buttons: [{ label: 'Abbrechen' }, { label: 'Speichern', cls: 'btn-leaf', onClick: () => { const v = md.querySelector('#dname').value.trim(); if (v) { dk.name = v; GJ.Save.save(); D.renderTabs(); } } }]
    });
    setTimeout(() => { const i = md.querySelector('#dname'); i.focus(); i.select(); }, 60);
  };

  D.renderBoard = function () {
    const L = layout(), b = document.getElementById('dboard');
    const coords = GJ.Save.d.settings.coords, col = color();
    let h = '';
    for (const r of [2, 1]) for (let f = 0; f < 8; f++) {
      const n = FILES[f] + r, t = L[n];
      h += `<div class="dsq ${(f + r) % 2 ? 'd' : 'l'} ${ED.hand ? 'hand-target' : ''} ${ED.handFrom === n ? 'from-sel' : ''}" data-n="${n}">${t ? `<div class="dpc ${ED.pop === n ? 'pop' : ''}" data-n="${n}">${PC()[t].svg(col, lvl(t) >= 3)}</div>` : ''}${coords && r === 1 ? `<span class="coord f">${FILES[f]}</span>` : ''}${coords && f === 0 ? `<span class="coord r">${r}</span>` : ''}</div>`;
    }
    b.innerHTML = h;
    b.querySelectorAll('.dpc').forEach(el => D.bindDrag(el, { type: L[el.dataset.n], from: el.dataset.n }));
    ED.pop = null;
  };

  D.renderInfo = function () {
    const S = GJ.Save, L = layout();
    const v = D.validate(L, !isMP(), vopts());
    const B = v.budget;
    const bud = document.getElementById('budget');
    if (B) {
      const pct = Math.min(100, v.cost / B * 100);
      bud.innerHTML = `<div class="budget-bar ${v.cost > B ? 'over' : v.cost >= B - 2 ? 'warn' : ''}"><div class="budget-fill" style="width:${pct}%"></div><div class="budget-txt">Kosten ${v.cost} / ${B}</div></div>`;
    } else bud.innerHTML = `<div class="budget-bar"><div class="budget-fill" style="width:100%;background:var(--blue)"></div><div class="budget-txt">Kein Limit · Kosten ${v.cost}</div></div>`;
    const chips = v.types.map(t => {
      const def = PC()[t], l = lvl(t);
      return `<span class="sp-chip ${l ? '' : 'off'}">${def.svg(color(), false)}${def.special.name}</span>`;
    }).join('');
    const active = !isMP() && S.d.activeDeck === ED.idx;
    document.getElementById('dinfo').innerHTML = `
      <div class="deck-status ${v.valid ? 'ok' : 'bad'}">${ic(v.valid ? 'check' : 'info')}<span>${v.valid ? `Deck bereit · ${v.count} Figuren · ${v.types.length} Specials` : v.errors.join('<br>')}</span></div>
      ${v.hints.length ? `<div class="deck-hints">${v.hints.join('<br>')}</div>` : ''}
      <div class="tool-row">
        <button class="btn btn-sm btn-icon" id="b-und" aria-label="Rückgängig" ${ED.undo.length ? '' : 'disabled'}>${ic('undo')}</button>
        <button class="btn btn-sm btn-icon" id="b-red" aria-label="Wiederholen" ${ED.redo.length ? '' : 'disabled'}>${ic('redo')}</button>
        <button class="btn btn-sm btn-icon" id="b-clr" aria-label="Leeren">${ic('trash')}</button>
        <button class="btn btn-sm grow" id="b-std">Klassisch</button>
        ${isMP() ? '' : `<button class="btn btn-sm btn-icon" id="b-dup" aria-label="Kopieren">${ic('copy')}</button>
        <button class="btn btn-sm btn-icon" id="b-ren" aria-label="Umbenennen">${ic('pencil')}</button>
        <button class="btn btn-sm btn-icon btn-blue" id="b-sbx" aria-label="Ausprobieren" ${v.valid ? '' : 'disabled'}>${ic('target')}</button>
        <button class="btn btn-sm grow ${active ? '' : 'btn-leaf'}" id="b-act" ${active ? 'disabled' : ''}>${active ? 'Aktiv' : 'Benutzen'}</button>`}
      </div>
      ${chips ? `<div class="sp-chips">${chips}</div>` : ''}`;
    const on = (id, fn) => { const e = document.getElementById(id); if (e) GJ.UI.tap(e, fn); };
    on('b-act', () => { S.d.activeDeck = ED.idx; S.save(); GJ.Audio.play('upgrade'); GJ.UI.toast('Dein Kampf-Deck: ' + S.d.decks[ED.idx].name); D.renderTabs(); D.renderInfo(); });
    on('b-std', () => { snapshot(); setLayout(Object.assign({}, C.CLASSIC_DECK)); commit('move'); });
    on('b-clr', () => { snapshot(); setLayout({}); commit('pop'); });
    on('b-dup', () => D.duplicate());
    on('b-ren', () => D.rename());
    on('b-und', () => D.undo());
    on('b-red', () => D.redo());
    on('b-sbx', () => GJ.Training.open({ white: Object.assign({}, L), black: Object.assign({}, C.CLASSIC_DECK) }));
    D.renderTabs();
  };

  D.duplicate = function () {
    const S = GJ.Save, cur = S.d.decks[ED.idx];
    const md = GJ.UI.modal({
      title: 'Deck kopieren', closeX: true,
      html: `<p>Wohin soll "${cur.name}" kopiert werden? Das Deck dort wird ersetzt.</p><div class="choice-list">${S.d.decks.map((dk, i) => i === ED.idx ? '' : `<button class="btn btn-sm" data-i="${i}">${dk.name}</button>`).join('')}</div>`
    });
    md.querySelectorAll('[data-i]').forEach(c => GJ.UI.tap(c, () => {
      const i = +c.dataset.i;
      S.d.decks[i] = { name: cur.name + ' 2', layout: Object.assign({}, cur.layout) };
      S.save(); GJ.UI.closeModal(md); ED.idx = i; ED.undo = []; ED.redo = []; GJ.UI.toast('Deck kopiert'); D.renderAll();
    }));
  };

  D.renderCollection = function () {
    const L = layout();
    const v = D.validate(L, false, vopts());
    let list = GJ.PIECE_ORDER.slice();
    if (ED.fCls !== 'all') list = list.filter(t => PC()[t].cls === ED.fCls);
    if (ED.fRar !== 'all') list = list.filter(t => PC()[t].rarity === ED.fRar);
    const rk = t => C.rarity[PC()[t].rarity].order;
    const ck = t => Object.keys(GJ.CLASS_NAMES).indexOf(PC()[t].cls);
    list.sort((a, b) => (owns(b) - owns(a)) || (ED.sort === 'cost' ? PC()[a].cost - PC()[b].cost : ED.sort === 'rarity' ? rk(a) - rk(b) : ck(a) - ck(b)) || PC()[a].index - PC()[b].index);
    const coll = document.getElementById('coll');
    coll.innerHTML = '';
    for (const t of list) {
      const def = PC()[t], own = owns(t), l = lvl(t);
      const max = isMP() ? 99 : C.deck.maxCopies[def.rarity], used = v.counts[t] || 0;
      const c = document.createElement('div');
      c.className = 'ccard' + (own ? '' : ' locked') + (own && used >= max ? ' limit' : '') + (ED.hand === t && !ED.handFrom ? ' in-hand' : '');
      c.style.setProperty('--rc', C.rarity[def.rarity].color);
      c.innerHTML = `<div class="cc-cost">${def.cost}</div>${def.svg(color(), own && l >= 3)}<div class="cc-name">${own ? def.name : '???'}</div>${used ? `<div class="cc-n">${used}x</div>` : ''}${own ? '' : `<div style="position:absolute;top:30%;left:50%;width:30px;margin-left:-15px">${ic('lock')}</div>`}`;
      if (own) D.bindDrag(c, { type: t });
      else c.onclick = () => { GJ.Audio.play('deny'); GJ.UI.toast('Gewinne diese Figur zuerst am Automaten'); };
      coll.appendChild(c);
    }
  };

  D.setHand = function (type, from) {
    if (!ED) return;
    ED.hand = type; ED.handFrom = from || null;
    D.renderBoard(); D.renderCollection();
    if (type && !from) GJ.UI.toast('Tippe auf ein Feld, um ' + PC()[type].name + ' zu setzen', 1600);
  };

  // ---------------- Ziehen & Tippen ----------------
  function sqAt(x, y) {
    const el = document.elementFromPoint(x, y);
    const s = el && el.closest && el.closest('.dsq');
    return s ? s.dataset.n : null;
  }
  function overBoard(x, y) {
    const b = document.getElementById('dboard');
    if (!b) return false;
    const r = b.getBoundingClientRect();
    return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
  }
  function tapped(src) {
    if (src.from) {
      if (ED.hand && !ED.handFrom) { D.place(ED.hand, src.from); return; }
      if (ED.handFrom === src.from) { D.setHand(null); return; }
      if (ED.handFrom) { D.place(ED.hand, src.from, ED.handFrom); ED.hand = null; ED.handFrom = null; D.renderBoard(); D.renderCollection(); return; }
      GJ.Audio.play('select');
      D.setHand(src.type, src.from);
    } else {
      GJ.Audio.play('select');
      D.setHand(ED.hand === src.type && !ED.handFrom ? null : src.type);
    }
  }
  // src: { type } aus der Sammlung oder { type, from } vom Brett
  D.bindDrag = function (el, src) {
    // Auf Touch-Geräten scrollt die Sammlung, Karten werden angetippt
    if (!src.from) {
      el.addEventListener('click', () => { GJ.Audio.init(); if (!el._dragged) tapped(src); el._dragged = false; });
    }
    el.addEventListener('pointerdown', e => {
      if (e.button === 2) return;
      if (!src.from && e.pointerType !== 'mouse') return;
      GJ.Audio.init();
      e.preventDefault();
      const start = { x: e.clientX, y: e.clientY };
      let ghost = null, hoverN = null;
      const mv = ev => {
        if (!ghost && Math.hypot(ev.clientX - start.x, ev.clientY - start.y) > 8) {
          ghost = document.createElement('div');
          ghost.className = 'drag-ghost';
          ghost.innerHTML = PC()[src.type].svg(color(), lvl(src.type) >= 3);
          document.body.appendChild(ghost);
          if (src.from) { const p = document.querySelector(`.dpc[data-n="${src.from}"]`); if (p) p.style.opacity = 0.3; }
        }
        if (ghost) {
          ghost.style.left = ev.clientX + 'px'; ghost.style.top = ev.clientY + 'px';
          const n = sqAt(ev.clientX, ev.clientY);
          if (n !== hoverN) {
            document.querySelectorAll('.dsq.hover').forEach(s => s.classList.remove('hover'));
            hoverN = n;
            if (n) { const s = document.querySelector(`.dsq[data-n="${n}"]`); if (s) s.classList.add('hover'); }
          }
        }
      };
      const up = ev => {
        window.removeEventListener('pointermove', mv);
        window.removeEventListener('pointerup', up);
        window.removeEventListener('pointercancel', up);
        document.querySelectorAll('.dsq.hover').forEach(s => s.classList.remove('hover'));
        if (ghost) {
          ghost.remove();
          el._dragged = true;
          const n = sqAt(ev.clientX, ev.clientY);
          ED.hand = null; ED.handFrom = null;
          if (n) { if (n !== src.from) D.place(src.type, n, src.from); else D.renderBoard(); }
          else if (src.from && !overBoard(ev.clientX, ev.clientY)) D.clearSq(src.from);
          else { D.renderBoard(); D.renderCollection(); }
        } else if (src.from) tapped(src);
      };
      window.addEventListener('pointermove', mv);
      window.addEventListener('pointerup', up);
      window.addEventListener('pointercancel', up);
    });
  };

  D.bindBoard = function () {
    const b = document.getElementById('dboard');
    b.addEventListener('contextmenu', e => {
      e.preventDefault();
      const s = e.target.closest('.dsq');
      if (s) D.clearSq(s.dataset.n);
    });
    b.addEventListener('click', e => {
      const s = e.target.closest('.dsq');
      if (!s || e.target.closest('.dpc')) return;
      const n = s.dataset.n;
      if (ED.hand && ED.handFrom) { D.place(ED.hand, n, ED.handFrom); ED.hand = null; ED.handFrom = null; D.renderBoard(); D.renderCollection(); }
      else if (ED.hand) D.place(ED.hand, n);
    });
  };
})();

  <script>
/* =====================================================================
   GAMBIT JACKPOT - slot.js
   Spielautomat: Ergebnis wird vorab bestimmt, dann animiert.
   ===================================================================== */
var GJ = globalThis.GJ = globalThis.GJ || {};
(function () {
  const C = GJ.CONFIG, FX = GJ.FX;
  const PC = () => GJ.PIECES;
  const SL = GJ.Slot = {};
  const RARS = ['gewoehnlich', 'selten', 'episch', 'legendaer'];
  let spinning = false, bulbTimer = null, bulbMode = 'idle', sym = 110;

  const byRarity = r => GJ.NEW_TYPES.filter(t => PC()[t].rarity === r);
  const pick = a => a[Math.floor(Math.random() * a.length)];

  // ---------------- Ergebnis bestimmen ----------------
  SL.decide = function () {
    const S = GJ.Save, sd = S.d.slot, O = C.slot.odds;
    const unowned = GJ.NEW_TYPES.filter(t => !S.owns(t));
    const forced = SL.forceNext; // nur für automatische Tests
    if (forced) {
      SL.forceNext = null;
      if (forced === 'niete') return { kind: 'niete' };
      if (forced === 'coins') return { kind: 'coins' };
      if (forced === 'neu' && unowned.length) return { kind: 'piece', type: pick(unowned), forced: true };
      if (RARS.includes(forced)) return { kind: 'piece', type: pick(byRarity(forced)), forced: true };
      if (PC()[forced]) return { kind: 'piece', type: forced, forced: true };
    }
    const unL = unowned.filter(t => PC()[t].rarity === 'legendaer');
    if (unL.length && sd.spinsSinceLegendary >= C.slot.pityLegendary) return { kind: 'piece', type: pick(unL), pity: 'legendaer' };
    if (unowned.length && sd.spinsSinceNew >= C.slot.pityNew) {
      // gewichtet nach Seltenheit unter den noch fehlenden
      const tot = unowned.reduce((a, t) => a + O[PC()[t].rarity] / byRarity(PC()[t].rarity).length, 0);
      let r = Math.random() * tot;
      for (const t of unowned) { r -= O[PC()[t].rarity] / byRarity(PC()[t].rarity).length; if (r <= 0) return { kind: 'piece', type: t, pity: 'neu' }; }
      return { kind: 'piece', type: unowned[0], pity: 'neu' };
    }
    const r = Math.random();
    let acc = 0;
    for (const rar of RARS) { acc += O[rar]; if (r < acc) return { kind: 'piece', type: pick(byRarity(rar)) }; }
    acc += O.coins;
    if (r < acc) return { kind: 'coins' };
    return { kind: 'niete' };
  };
  SL.symbolsFor = function (out) {
    const pool = GJ.NEW_TYPES.concat(['coin', 'coal']);
    if (out.kind === 'piece') return [out.type, out.type, out.type];
    if (out.kind === 'coins') return ['coin', 'coin', 'coin'];
    if (Math.random() < C.slot.nearMissChance) {
      const a = pick(GJ.NEW_TYPES);
      let b; do { b = pick(pool); } while (b === a);
      return [a, a, b];
    }
    let s;
    do { s = [pick(pool), pick(pool), pick(pool)]; } while (s[0] === s[1] && s[1] === s[2]);
    return s;
  };

  // ---------------- Darstellung ----------------
  function symHTML(s) {
    if (s === 'coin') return `<div class="sym"><div class="sym-in" style="--rc:#ffe58a">${GJ.icon('coin')}</div></div>`;
    if (s === 'coal') return `<div class="sym"><div class="sym-in" style="--rc:#5a5a66"><div class="coal"></div></div></div>`;
    const def = PC()[s];
    return `<div class="sym"><div class="sym-in" style="--rc:${C.rarity[def.rarity].color}">${def.svg('w', false)}</div></div>`;
  }
  function stripSymbol() {
    const w = C.slot.stripWeights;
    const pool = [];
    GJ.NEW_TYPES.forEach(t => { for (let i = 0; i < w[PC()[t].rarity]; i++) pool.push(t); });
    for (let i = 0; i < w.coin; i++) pool.push('coin');
    for (let i = 0; i < w.coal; i++) pool.push('coal');
    return pick(pool);
  }

  SL.open = function () {
    const S = GJ.Save;
    spinning = false;
    const cost = S.spinCost();
    GJ.UI.shell('slot', 'Automat', `
      <div class="slot-wrap">
        <div class="machine" id="machine">
          <div class="machine-head"><div class="toon">JACKPOT</div></div>
          <div class="bulbs" id="bulbs">${'<div class="bulb"></div>'.repeat(12)}</div>
          <div class="reels-frame" id="reels">${[0, 1, 2].map(i => `<div class="reel" id="reel${i}"><div class="reel-strip"></div></div>`).join('')}<div class="payline"></div></div>
          <div class="machine-bottom">
            <button class="btn btn-blue btn-icon" id="odds" aria-label="Gewinnchancen">${GJ.icon('info')}</button>
            <button class="btn btn-sun btn-lg spin-btn" id="spin">Drehen ${GJ.icon('coin')}<span class="n">${cost}</span></button>
          </div>
        </div>
        <div class="slot-pills" id="sinfo"></div>
      </div>`, { raw: true });
    SL.sizeReels();
    window.onresize = () => { if (GJ.UI.current === 'slot') SL.sizeReels(); };
    const start = [pick(GJ.NEW_TYPES), pick(GJ.NEW_TYPES), pick(GJ.NEW_TYPES)];
    SL.cur = start;
    [0, 1, 2].forEach(i => SL.setStrip(i, [stripSymbol(), start[i], stripSymbol()], 1));
    document.getElementById('spin').onclick = () => SL.pull();
    GJ.UI.tap(document.getElementById('odds'), () => SL.showOdds());
    SL.renderInfo();
    SL.bulbs('idle');
  };
  GJ.UI = GJ.UI || {}; GJ.UI.screens = GJ.UI.screens || {};
  GJ.UI.screens.slot = SL.open;

  SL.sizeReels = function () {
    const r = document.getElementById('reel0');
    if (!r) return;
    sym = Math.min(130, r.clientWidth * 0.95, Math.max(60, (window.innerHeight - 430) / 1.55));
    sym = Math.max(56, sym);
    document.getElementById('reels').style.setProperty('--sym', sym + 'px');
    [0, 1, 2].forEach(i => { const st = document.querySelector(`#reel${i} .reel-strip`); if (st && st._idx != null) st.style.transform = `translateY(${SL.ty(st._idx)}px)`; });
  };
  SL.ty = k => -(k * sym) + 0.275 * sym;
  SL.setStrip = function (i, list, idx) {
    const st = document.querySelector(`#reel${i} .reel-strip`);
    st.innerHTML = list.map(symHTML).join('');
    st._idx = idx;
    st.style.transform = `translateY(${SL.ty(idx)}px)`;
    return st;
  };

  SL.renderInfo = function () {
    const S = GJ.Save, sd = S.d.slot;
    const unowned = GJ.NEW_TYPES.filter(t => !S.owns(t));
    const unL = unowned.filter(t => PC()[t].rarity === 'legendaer');
    const el = document.getElementById('sinfo');
    if (!el) return;
    const I = GJ.icon;
    el.innerHTML = `<span class="pill">${I('cards')} Sammlung <b>${GJ.NEW_TYPES.length - unowned.length} / ${GJ.NEW_TYPES.length}</b></span>` +
      (unowned.length ? `<span class="pill">${I('star')} Neue Figur sicher in <b>${Math.max(1, C.slot.pityNew - sd.spinsSinceNew + 1)}</b></span>` : `<span class="pill">${I('trophy')} Alles gesammelt</span>`) +
      (unL.length ? `<span class="pill">${I('crown')} Legendär sicher in <b>${Math.max(1, C.slot.pityLegendary - sd.spinsSinceLegendary + 1)}</b></span>` : '');
    const b = document.getElementById('spin');
    if (b) { const ok = S.d.ep >= S.spinCost(); b.disabled = spinning; b.classList.toggle('disabled', !ok); b.title = ok ? '' : `Noch ${S.spinCost() - S.d.ep} EP: gewinne ein Match!`; }
  };

  SL.bulbs = function (mode) {
    bulbMode = mode;
    if (bulbTimer) clearInterval(bulbTimer);
    let k = 0;
    const tick = () => {
      const bs = document.querySelectorAll('#bulbs .bulb');
      if (!bs.length) { clearInterval(bulbTimer); return; }
      bs.forEach((b, i) => {
        let on;
        if (bulbMode === 'idle') on = (i + k) % 4 === 0;
        else if (bulbMode === 'spin') on = (i + k) % 3 === 0;
        else on = k % 2 === 0;
        b.classList.toggle('on', on);
      });
      k++;
    };
    bulbTimer = setInterval(tick, mode === 'idle' ? 380 : mode === 'spin' ? 90 : 120);
    tick();
  };

  SL.pull = async function () {
    GJ.Audio.init();
    if (spinning) return;
    const S = GJ.Save, cost = S.spinCost();
    if (S.d.ep < cost) { GJ.Audio.play('deny'); GJ.UI.toast(`Dir fehlen ${cost - S.d.ep} EP. Gewinne ein Match gegen einen Bot!`); return; }
    GJ.UI.buzz(25);
    const mach = document.getElementById('machine');
    FX.anim(mach, [{ transform: 'scale(1)' }, { transform: 'scale(.97, 1.03)' }, { transform: 'scale(1)' }], { duration: 220 });
    GJ.Audio.play('click');
    S.spendEP(cost);
    S.d.stats.spins++;
    const out = SL.decide();
    const syms = SL.symbolsFor(out);
    spinning = true;
    SL.renderInfo();
    await SL.animate(syms);
    await SL.resolve(out, syms);
    spinning = false;
    SL.renderInfo();
    SL.bulbs('idle');
  };

  SL.animate = async function (syms) {
    SL.bulbs('spin');
    const f = FX.speed() || 0.15;
    const stops = C.slot.reelStops.map(x => x * f);
    const suspense = syms[0] === syms[1];
    if (suspense) stops[2] += C.slot.suspenseExtra * f;
    const proms = [0, 1, 2].map(i => new Promise(res => {
      const L = Math.round(stops[i] / 1000 * 16 / Math.max(f, 0.4)) + 6 + (i === 2 && suspense ? 6 : 0);
      const list = [stripSymbol(), SL.cur[i]];
      for (let k = 0; k < L; k++) list.push(stripSymbol());
      list.push(syms[i], stripSymbol());
      const st = SL.setStrip(i, list, 1);
      const reel = document.getElementById('reel' + i);
      reel.classList.add('blur');
      reel.classList.remove('win-glow');
      const target = list.length - 2;
      const y0 = SL.ty(1), y1 = SL.ty(target), over = sym * 0.12;
      const t0 = performance.now(), d = stops[i];
      let lastIdx = 1, lastTick = 0;
      const step = now => {
        const t = Math.min(1, (now - t0) / d);
        const e = 1 - Math.pow(1 - t, i === 2 && suspense ? 4 : 3);
        const y = y0 + (y1 - over - y0) * e;
        st.style.transform = `translateY(${y}px)`;
        const idx = Math.floor((SL.ty(0) - y) / sym);
        if (idx !== lastIdx && now - lastTick > 45) { GJ.Audio.play('tick'); lastTick = now; }
        lastIdx = idx;
        if (t > 0.72) reel.classList.remove('blur');
        if (t < 1) requestAnimationFrame(step);
        else {
          FX.anim(st, [{ transform: `translateY(${y1 - over}px)` }, { transform: `translateY(${y1}px)` }], { duration: 160, easing: 'cubic-bezier(.3,1.8,.5,1)' }).then(() => {
            st.style.transform = `translateY(${y1}px)`; st._idx = target;
          });
          st.style.transform = `translateY(${y1}px)`;
          GJ.Audio.play('reelStop');
          if (i === 1 && suspense) { document.getElementById('reels').classList.add('suspense'); GJ.Audio.play('drumroll'); }
          res();
        }
      };
      requestAnimationFrame(step);
    }));
    await Promise.all(proms);
    document.getElementById('reels').classList.remove('suspense');
    SL.cur = syms.slice();
    await FX.sleep(180);
  };

  SL.resolve = async function (out, syms) {
    const S = GJ.Save, sd = S.d.slot;
    if (out.kind === 'niete') {
      sd.spinsSinceNew++; sd.spinsSinceLegendary++;
      S.save();
      GJ.Audio.play(syms[0] === syms[1] ? 'deny' : 'reelStop');
      if (syms[0] === syms[1]) GJ.UI.toast('So knapp! Zwei gleiche ...');
      return;
    }
    const color = out.kind === 'coins' ? '#ffd060' : C.rarity[PC()[out.type].rarity].color;
    document.querySelectorAll('.reel').forEach(r => { r.style.setProperty('--rc', color); r.classList.add('win-glow'); });
    SL.bulbs('win');
    GJ.Audio.play('jingle');
    const mc = FX.center(document.getElementById('reels'));
    FX.burst(mc.x, mc.y, { n: 60, colors: [color, '#fff', '#ffe08a'], speed: 7, shape: 'star', size: 6, gravity: 0.08 });
    await FX.sleep(700);
    if (out.kind === 'coins') {
      sd.spinsSinceNew++; sd.spinsSinceLegendary++;
      const pay = C.slot.coinPayout;
      FX.burst(mc.x, mc.y - 40, { n: 40, colors: ['#ffe08a', '#f5c451', '#b8862b'], speed: 6, shape: 'circle', size: 7, gravity: 0.25, life: 70, up: 4 });
      await FX.coinsFly(mc, document.querySelector('.ep-chip'), 8);
      S.addEP(pay);
      GJ.UI.toast(`3 Münzen! +${pay} EP`);
      S.save();
      return;
    }
    const type = out.type, def = PC()[type], isNew = !S.owns(type);
    if (isNew) { S.unlock(type); sd.spinsSinceNew = 0; } else sd.spinsSinceNew++;
    if (def.rarity === 'legendaer') sd.spinsSinceLegendary = 0; else sd.spinsSinceLegendary++;
    S.save();
    await SL.reveal(type, isNew);
  };

  SL.reveal = function (type, isNew) {
    return new Promise(res => {
      const S = GJ.Save, def = PC()[type], rc = C.rarity[def.rarity];
      const leg = def.rarity === 'legendaer';
      const bg = document.createElement('div');
      bg.className = 'reveal-bg';
      bg.style.setProperty('--rc', rc.color);
      const label = isNew ? (leg ? 'LEGENDÄR!' : 'NEUE FIGUR!') : 'DUPLIKAT';
      bg.innerHTML = `<div class="burst"></div><div class="reveal-label toon">${label}</div>
        <div class="rv-card" style="--rc:${rc.color}"><span class="rar">${rc.name}</span><div class="nm toon">${def.name}</div>
          ${def.svg('w', false)}
          ${GJ.UI.diagramHTML(type, 1, true)}
          <div class="sp"><b>${def.special.name}:</b> ${def.special.desc()[0]}</div></div>
        <div class="reveal-actions"></div>`;
      document.getElementById('modal-root').appendChild(bg);
      const act = bg.querySelector('.reveal-actions');
      const close = () => { bg.remove(); res(); };
      if (isNew) {
        GJ.Audio.play(leg ? 'fanfare' : 'upgrade');
        if (leg) { FX.confetti(220); setTimeout(() => FX.flash(rc.color, 0.5, 600), 200); }
        setTimeout(() => { const c = FX.center(bg.querySelector('.rv-card')); FX.pow(c.x, c.y, { color: rc.color, size: 260 }); FX.burst(c.x, c.y, { n: 40, colors: [rc.color, '#ffc83d', '#fff'], speed: 9, shape: 'star', size: 12, gravity: 0.2 }); }, 650 * (FX.speed() || 0.2));
        const b1 = document.createElement('button'); b1.className = 'btn btn-sun'; b1.innerHTML = GJ.icon('deck') + ' Ins Deck';
        b1.onclick = () => { close(); GJ.UI.go('deck'); GJ.Deck.setHand(type); };
        const b2 = document.createElement('button'); b2.className = 'btn'; b2.textContent = 'Weiter';
        b2.onclick = close;
        act.append(b1, b2);
      } else {
        const refund = C.economy.duplicateEP[def.rarity];
        GJ.Audio.play('reelStop');
        setTimeout(async () => {
          const card = bg.querySelector('.rv-card');
          const c = FX.center(card);
          await FX.anim(card, [{ transform: 'scale(1)', opacity: 1, filter: 'brightness(1)' }, { transform: 'scale(.6) rotate(8deg)', opacity: 0, filter: 'brightness(3)' }], { duration: 450, fill: 'forwards' });
          FX.burst(c.x, c.y, { n: 40, colors: ['#ffe08a', '#f5c451', rc.color], speed: 6, shape: 'circle', size: 6, gravity: 0.15 });
          bg.querySelector('.reveal-label').innerHTML = `+${refund} EP`;
          await FX.coinsFly(c, document.querySelector('.ep-chip'), 6);
          S.addEP(refund);
          const b2 = document.createElement('button'); b2.className = 'btn btn-leaf'; b2.textContent = 'Weiter';
          b2.onclick = close;
          act.append(b2);
        }, 1300 * (FX.speed() || 0.3));
      }
    });
  };

  SL.showOdds = function () {
    const O = C.slot.odds, pct = x => (x * 100).toFixed(1).replace('.0', '') + ' %';
    const niete = 1 - RARS.reduce((a, r) => a + O[r], 0) - O.coins;
    const dup = RARS.map(r => C.economy.duplicateEP[r]);
    const rows = RARS.map((r, i) => `<tr><td><span class="rar-tag" style="--rc:${C.rarity[r].color}">${C.rarity[r].name}</span> <span style="font-size:12px;font-weight:400">${byRarity(r).length} Figuren</span></td><td>${pct(O[r])}</td><td>Figur · Duplikat: ${dup[i]} EP</td></tr>`).join('');
    GJ.UI.modal({
      title: 'Gewinnchancen', wide: true, closeX: true,
      html: `<table class="odds-table"><tr><th>Ergebnis</th><th>Chance</th><th>Gewinn</th></tr>${rows}
        <tr><td>3x Münze</td><td>${pct(O.coins)}</td><td>${C.slot.coinPayout} EP</td></tr>
        <tr><td>Niete</td><td>${pct(niete)}</td><td>nichts</td></tr></table>
        <p style="margin-top:12px;font-size:13px">Glückszähler: Nach ${C.slot.pityNew} Drehs ohne neue Figur ist der nächste Dreh garantiert eine Figur, die du noch nicht hast. Nach ${C.slot.pityLegendary} Drehs ohne Legendär ist der nächste garantiert legendär (solange dir noch eine fehlt).</p>
        <p style="font-size:13px">Kosten pro Dreh: ${GJ.Save.spinCost()} EP.</p>`,
      buttons: [{ label: 'OK', cls: 'btn-leaf' }]
    });
  };
})();
